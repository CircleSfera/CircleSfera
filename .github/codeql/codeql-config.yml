name: "CircleSfera CodeQL Configuration"

# Paths to exclude from analysis.
# e2e test helpers use Math.random() intentionally for non-security-critical
# test identity generation — this is not production code.
paths-ignore:
  - "circlesfera-frontend/e2e/**"
  - "e2e/**"
  - "scripts/**"

# No repository-wide query exclusions: a rule disabled here is disabled for
# every file. Confirmed false positives are dismissed per alert in code
# scanning, with the justification recorded on the alert.
