version: 2
updates:
  # Prefer fewer, grouped PRs so we do not open 20+ at once.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      root-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: /circlesfera-backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      # First match wins. Keep vitest peers in lockstep across major/minor/patch.
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      backend-deps:
        patterns: ["*"]
        exclude-patterns:
          - "vitest"
          - "@vitest/*"
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: /circlesfera-frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      frontend-deps:
        patterns: ["*"]
        exclude-patterns:
          - "vitest"
          - "@vitest/*"
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: /circlesfera-shared
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      shared-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /circlesfera-backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    # Stay on Node Active LTS (24.x). Node 26 is Current, not LTS yet.
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /circlesfera-frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
