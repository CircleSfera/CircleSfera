# Reusable quality gate — called by pr.yml and deploy.yml so PR and deploy
# run the same checks (Biome, build, lint, unit, Prisma drift, backend e2e, FE).
name: CI Quality

on:
  workflow_call: {}
  workflow_dispatch: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  # The pinned images the jobs start from are kept in this repository's
  # own registry.
  packages: read

jobs:
  test:
    name: Run Lint and Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        # Our own copy of the pinned image (see "Ops — copy pinned images").
        image: ghcr.io/circlesfera/circlesfera/mirror/pgvector:pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          POSTGRES_USER: prisma
          POSTGRES_PASSWORD: prisma
          POSTGRES_DB: schema_check
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prisma -d schema_check"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        # Our own copy of the pinned image (see "Ops — copy pinned images"):
        # the public mirror stops serving it once its daily allowance is used.
        image: ghcr.io/circlesfera/circlesfera/mirror/redis:7-alpine@sha256:57e4255cc971b1c8d6f8a6ca283ac01bc3ecdd914273ef6bfaede87aaecd6541
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: "npm"

      - name: "Dependencies: Verify Lockfile Integrity & Provenance"
        run: npm run verify:lockfiles:fast

      - name: "Dependencies: Production Code Imports Only Production Packages"
        run: npm run verify:runtime-deps

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: "Root: Biome CI (Format & Lint)"
        run: npx biome ci .

      - name: "Nginx: Config & Traffic Policy Lint"
        run: npm run nginx:lint

      - name: "Containers: Verify Base & Service Image Digests"
        run: npm run docker:verify-digests

      - name: "Security: Audit Production Dependencies"
        run: npm run audit:deps

      - name: "Shared: Install, Build and Check Dependency Graph"
        run: |
          cd circlesfera-shared
          npm ci
          npm run build
          npm run check:deps

      - name: "Backend: Install, Build, Lint and Test (Enforce Coverage Thresholds)"
        run: |
          cd circlesfera-backend
          npm ci
          npx prisma generate
          npm run build
          npm run lint
          npm run check:deps
          npm run test:cov

      - name: "Prisma: schema vs migrations"
        env:
          DATABASE_URL: postgresql://prisma:prisma@localhost:5432/schema_check
        run: ./scripts/check-prisma-schema-migrations.sh

      - name: "Migration safety check (Expand/Contract)"
        run: npm run db:lint-migrations

      - name: "Smoke: User/Profile identity drift"
        run: npm run smoke:profile-drift

      # Reuses the schema_check Postgres DB, which is now fully migrated by the
      # step above. Redis is required by BullMQ / the cache module used across
      # AppModule. Secrets below are non-production dummies; NODE_ENV=test
      # bypasses the production-only secret-strength check in src/main.ts
      # (e2e specs build AppModule directly and never call bootstrap()).
      - name: "Backend: E2E Tests"
        env:
          DATABASE_URL: postgresql://prisma:prisma@localhost:5432/schema_check
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          NODE_ENV: test
          JWT_SECRET: ci-e2e-jwt-secret-not-for-production-use-only-testing-1234567890
          JWT_REFRESH_SECRET: ci-e2e-refresh-secret-not-for-production-use-only-testing-0987654321
          CSRF_SECRET: ci-e2e-csrf-secret-not-for-production-use-only-testing-abcdefghijklmno
          ENCRYPTION_KEY: test-encryption-key-32-characters!!
          ABUSE_HASH_PEPPER: ci-e2e-abuse-hash-pepper-not-for-production-use!!
          STRIPE_SECRET_KEY: sk_test_dummy
          STRIPE_WEBHOOK_SECRET: whsec_dummy
          CLOUDINARY_NAME: dummy
          CLOUDINARY_API_KEY: dummy
          CLOUDINARY_API_SECRET: dummy
          CORS_ORIGIN: http://localhost:5173
        run: |
          cd circlesfera-backend
          npm run test:e2e

      - name: "Frontend: Install, Lint, Test and Build"
        run: |
          cd circlesfera-frontend
          npm ci
          npm run lint
          npm run check:deps
          npm run test:cov
          npm run build
