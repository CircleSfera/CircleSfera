name: Deploy to OVH VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only one deploy at a time; queue instead of cancelling mid-SSH rollout.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: circlesfera/circlesfera
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  # The pinned images the jobs start from are kept in this repository's
  # own registry.
  packages: read

jobs:
  test:
    name: Run Lint and Unit Tests
    # Local path: a PR that changes ci-quality.yml is checked with its own
    # version. (Some editors cannot resolve this path because the workspace
    # path contains spaces; GitHub resolves it fine.)
    uses: ./.github/workflows/ci-quality.yml
    secrets: inherit

  build:
    name: Build and Push Docker Images
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # Our own copy of the pinned image of the build tool (see
          # "Ops — copy pinned images"); the sign-in above lets it be read.
          driver-opts: |
            image=ghcr.io/circlesfera/circlesfera/mirror/buildkit:buildx-stable-1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea

      # The base images of the Dockerfiles come from our own copy, made here
      # when a digest is new: the public mirror stops serving once its
      # allowance is used up and failed deploys with "toomanyrequests".
      - name: Build from our own copy of the base images
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$REGISTRY_TOKEN" | skopeo login ghcr.io --username "$REGISTRY_USER" --password-stdin
          ./scripts/use-own-base-images.sh ghcr.io/circlesfera/circlesfera/mirror \
            circlesfera-backend/Dockerfile circlesfera-frontend/Dockerfile

      - name: Resolve frontend Vite build args
        id: vite_args
        env:
          ENV_PRODUCTION_B64: ${{ secrets.ENV_PRODUCTION_B64 }}
          SECRET_VITE_API_URL: ${{ secrets.VITE_API_URL }}
          SECRET_VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}
        run: |
          set -euo pipefail
          LIVEKIT_URL=""
          API_URL="${SECRET_VITE_API_URL:-}"
          TURNSTILE_SITE_KEY="${SECRET_VITE_TURNSTILE_SITE_KEY:-}"

          if [ -z "${ENV_PRODUCTION_B64:-}" ]; then
            echo "❌ Secret ENV_PRODUCTION_B64 is missing. Run ./scripts/upload-prod-env.sh locally."
            exit 1
          fi

          ENV_FILE="$(mktemp)"
          echo "$ENV_PRODUCTION_B64" | base64 -d > "$ENV_FILE"

          # Prefer VITE_LIVEKIT_URL; fall back to LIVEKIT_URL (same WSS endpoint).
          LIVEKIT_URL="$(
            grep -E '^(VITE_LIVEKIT_URL|LIVEKIT_URL)=' "$ENV_FILE" \
              | head -1 \
              | cut -d= -f2- \
              | sed -e 's/^"//' -e 's/"$//' -e "s/^'//" -e "s/'$//"
          )"

          if [ -z "$API_URL" ]; then
            API_URL="$(
              grep -E '^VITE_API_URL=' "$ENV_FILE" \
                | head -1 \
                | cut -d= -f2- \
                | sed -e 's/^"//' -e 's/"$//' -e "s/^'//" -e "s/'$//"
            )"
          fi

          SENTRY_DSN="$(
            grep -E '^VITE_SENTRY_DSN=' "$ENV_FILE" \
              | head -1 \
              | cut -d= -f2- \
              | sed -e 's/^"//' -e 's/"$//' -e "s/^'//" -e "s/'$//"
          )"

          if [ -z "$TURNSTILE_SITE_KEY" ]; then
            TURNSTILE_SITE_KEY="$(
              grep -E '^VITE_TURNSTILE_SITE_KEY=' "$ENV_FILE" \
                | head -1 \
                | cut -d= -f2- \
                | sed -e 's/^"//' -e 's/"$//' -e "s/^'//" -e "s/'$//"
            )"
          fi

          # Public (pk.) token, restricted by URL in the Mapbox account. Optional:
          # without it the map and place search show a "token missing" notice.
          MAPBOX_ACCESS_TOKEN="$(
            grep -E '^VITE_MAPBOX_ACCESS_TOKEN=' "$ENV_FILE" \
              | head -1 \
              | cut -d= -f2- \
              | sed -e 's/^"//' -e 's/"$//' -e "s/^'//" -e "s/'$//"
          )"

          rm -f "$ENV_FILE"

          if [ -z "$MAPBOX_ACCESS_TOKEN" ]; then
            echo "::warning::VITE_MAPBOX_ACCESS_TOKEN missing in .env.production; maps and place search will be disabled."
          fi

          if [ -z "$API_URL" ]; then
            echo "❌ VITE_API_URL missing (GitHub secret VITE_API_URL or key in .env.production)."
            exit 1
          fi
          if [ -z "$LIVEKIT_URL" ]; then
            echo "❌ LIVEKIT_URL (or VITE_LIVEKIT_URL) missing in .env.production."
            echo "   Re-run ./scripts/upload-prod-env.sh after adding it."
            exit 1
          fi

          {
            echo "api_url=$API_URL"
            echo "livekit_url=$LIVEKIT_URL"
            echo "sentry_dsn=$SENTRY_DSN"
            echo "turnstile_site_key=$TURNSTILE_SITE_KEY"
            echo "mapbox_access_token=$MAPBOX_ACCESS_TOKEN"
          } >> "$GITHUB_OUTPUT"
          echo "✅ Vite build args resolved (API + LiveKit URL + optional Sentry, Turnstile and Mapbox)."

      - name: Build and push Backend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./circlesfera-backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend:${{ github.sha }}
          # Errors reported to Sentry name the commit they come from.
          build-args: |
            SENTRY_RELEASE=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Frontend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./circlesfera-frontend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:${{ github.sha }}
          build-args: |
            VITE_API_URL=${{ steps.vite_args.outputs.api_url }}
            VITE_LIVEKIT_URL=${{ steps.vite_args.outputs.livekit_url }}
            VITE_SENTRY_DSN=${{ steps.vite_args.outputs.sentry_dsn }}
            VITE_TURNSTILE_SITE_KEY=${{ steps.vite_args.outputs.turnstile_site_key }}
            VITE_MAPBOX_ACCESS_TOKEN=${{ steps.vite_args.outputs.mapbox_access_token }}
            VITE_SENTRY_RELEASE=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Every change reaches staging before production. While staging is not set
  # up on the server (the repository variable STAGING_ENABLED is not "true")
  # this job is skipped and production deploys as it always did.
  staging:
    name: Staging
    needs: test
    if: ${{ vars.STAGING_ENABLED == 'true' }}
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: staging
    secrets: inherit
    permissions:
      contents: read
      packages: write

  deploy:
    name: Deploy to Production
    needs: [build, staging]
    # A change that failed on staging stops here. A skipped staging does not.
    if: ${{ !cancelled() && needs.build.result == 'success' && (needs.staging.result == 'success' || needs.staging.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # GITHUB_TOKEN is passed into the VPS docker login; it must be able to pull GHCR images.
    permissions:
      contents: read
      packages: read

    steps:
      - name: Require the pinned VPS host key
        # Fail closed: without the fingerprint, the SSH step would not verify
        # that it is talking to the real VPS.
        env:
          VPS_SSH_FINGERPRINT: ${{ secrets.VPS_SSH_FINGERPRINT }}
        run: |
          if [ -z "$VPS_SSH_FINGERPRINT" ]; then
            echo "The VPS_SSH_FINGERPRINT secret is not set; refusing to connect."
            exit 1
          fi
      - name: Execute Remote SSH Deployment
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          ENV_PRODUCTION_B64: ${{ secrets.ENV_PRODUCTION_B64 }}
          ABUSE_HASH_PEPPER: ${{ secrets.ABUSE_HASH_PEPPER }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          STRIPE_PAYMENT_METHOD_CONFIGURATION: ${{ secrets.STRIPE_PAYMENT_METHOD_CONFIGURATION }}
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}
          # Read by the script as plain variables: a script with no ${{ }} in
          # it is not held to GitHub's 21,000-character limit on expressions.
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # Verifies the server identity (SHA256 host key fingerprint).
          fingerprint: ${{ secrets.VPS_SSH_FINGERPRINT }}
          envs: ENV_PRODUCTION_B64,ABUSE_HASH_PEPPER,TURNSTILE_SECRET_KEY,STRIPE_PAYMENT_METHOD_CONFIGURATION,VITE_TURNSTILE_SITE_KEY,GHCR_USER,GHCR_TOKEN,DEPLOY_SHA
          script: |
            set -e
            echo "Starting deployment on OVH VPS..."

            # Navigate to project directory
            cd /srv/circlesfera

            # Login to GHCR on the VPS
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            # Pull latest code (for docker-compose.prod.yml and nginx config)
            git fetch origin
            git reset --hard origin/main

            # Write secrets AFTER reset so they are never affected by checkout.
            # Compose interpolates ${VAR} from the project `.env` file by default;
            # service `env_file:` does NOT feed interpolation.
            # Both env files hold every production secret and other project
            # users share this VPS: close existing copies before writing, and
            # create new ones private (umask is restored once they exist).
            chmod 600 .env.production .env 2>/dev/null || true
            umask 077
            if [ -n "$ENV_PRODUCTION_B64" ]; then
              echo "$ENV_PRODUCTION_B64" | base64 -d > .env.production
              echo "✅ .env.production written from secret."
            else
              echo "⚠️  WARNING: ENV_PRODUCTION_B64 secret not set. Using existing .env.production."
            fi

            if [ ! -f .env.production ]; then
              echo "❌ .env.production is missing."
              exit 1
            fi

            # Merge ABUSE_HASH_PEPPER when ENV_PRODUCTION_B64 predates the pepper (avoid full env re-upload).
            if ! grep -qE '^ABUSE_HASH_PEPPER=.{32,}' .env.production; then
              if [ -n "${ABUSE_HASH_PEPPER:-}" ]; then
                printf '\nABUSE_HASH_PEPPER=%s\n' "$ABUSE_HASH_PEPPER" >> .env.production
                echo "✅ ABUSE_HASH_PEPPER merged from GitHub secret."
              fi
            fi

            # Card-only Payment Method Configuration for one-off payments
            # (Stripe Dashboard, pmc_...). The secret wins over the file.
            if [ -n "${STRIPE_PAYMENT_METHOD_CONFIGURATION:-}" ]; then
              sed -i '/^STRIPE_PAYMENT_METHOD_CONFIGURATION=/d' .env.production
              printf 'STRIPE_PAYMENT_METHOD_CONFIGURATION=%s\n' "$STRIPE_PAYMENT_METHOD_CONFIGURATION" >> .env.production
              echo "✅ STRIPE_PAYMENT_METHOD_CONFIGURATION merged from GitHub secret."
            fi

            if ! grep -qE '^TURNSTILE_SECRET_KEY=.' .env.production; then
              if [ -n "${TURNSTILE_SECRET_KEY:-}" ]; then
                printf 'TURNSTILE_SECRET_KEY=%s\n' "$TURNSTILE_SECRET_KEY" >> .env.production
                echo "✅ TURNSTILE_SECRET_KEY merged from GitHub secret."
              fi
            fi
            if ! grep -qE '^VITE_TURNSTILE_SITE_KEY=.' .env.production; then
              if [ -n "${VITE_TURNSTILE_SITE_KEY:-}" ]; then
                printf 'VITE_TURNSTILE_SITE_KEY=%s\n' "$VITE_TURNSTILE_SITE_KEY" >> .env.production
                echo "✅ VITE_TURNSTILE_SITE_KEY merged from GitHub secret."
              fi
            fi

            # Production lets nobody past Turnstile: the signed-in smoke check
            # that needed it runs on staging. A token or an allowlist left by
            # an earlier deploy is removed.
            sed -i '/^TURNSTILE_BYPASS_IPS=/d;/^TURNSTILE_BYPASS_TOKEN=/d' .env.production

            if ! grep -q '^REDIS_PASSWORD=.\+' .env.production; then
              echo "❌ REDIS_PASSWORD is missing/empty in .env.production (required for compose interpolation)."
              exit 1
            fi
            if ! grep -qE '^STRIPE_PAYMENT_METHOD_CONFIGURATION=pmc_[A-Za-z0-9]+$' .env.production; then
              echo "❌ STRIPE_PAYMENT_METHOD_CONFIGURATION (card-only, pmc_...) is missing or invalid."
              echo "   Create it in the Stripe Dashboard, then: gh secret set STRIPE_PAYMENT_METHOD_CONFIGURATION"
              exit 1
            fi
            if ! grep -qE '^ABUSE_HASH_PEPPER=.{32,}' .env.production; then
              echo "❌ ABUSE_HASH_PEPPER is missing or shorter than 32 chars."
              echo "   Set GitHub secret: gh secret set ABUSE_HASH_PEPPER"
              echo "   Or add to .env.production and run: ./scripts/upload-prod-env.sh"
              exit 1
            fi
            if ! grep -qE '^TURNSTILE_SECRET_KEY=.' .env.production; then
              echo "❌ TURNSTILE_SECRET_KEY is missing in .env.production."
              echo "   Set GitHub secret: gh secret set TURNSTILE_SECRET_KEY"
              echo "   Or add to .env.production and run: ./scripts/upload-prod-env.sh"
              exit 1
            fi

            # Ensure default Compose env file exists for ${REDIS_PASSWORD} / ${POSTGRES_*} interpolation
            cp .env.production .env
            chmod 600 .env.production .env
            umask 022

            # Extract the deployment webhook directly from the .env file to bypass IDE schema warnings
            DEPLOY_WEBHOOK=$(grep '^SLACK_WEBHOOK_DEPLOYMENTS=' .env.production | cut -d '=' -f2- || echo "")

            export REGISTRY=ghcr.io/circlesfera/circlesfera
            export IMAGE_SHA="$DEPLOY_SHA"
            PREV_SHA=""
            if [ -f .deploy-sha ]; then
              PREV_SHA="$(cat .deploy-sha)"
            fi
            # The version a rollback returns to. On a rerun of the same commit
            # it is the one recorded before it, whose images must stay too.
            KEEP_PREV="$PREV_SHA"
            if [ "$PREV_SHA" = "$IMAGE_SHA" ] && [ -f .deploy-sha.previous ]; then
              KEEP_PREV="$(cat .deploy-sha.previous)"
            fi

            # Pre-migrate Postgres backup (best-effort; never fail the deploy).
            # Prefer a path writable by the deploy user (/srv/...), not /var/backups.
            echo "Taking pre-deploy Postgres backup..."
            set +e
            BACKUP_ROOT="/srv/circlesfera/backups/postgres"
            mkdir -p "${BACKUP_ROOT}" /srv/circlesfera/backups/etl
            MKDIR_RC=$?
            # Database dumps and media archives: closed to other users of the
            # VPS. Fails the deploy (before any container changes) if it cannot.
            if [ -d /srv/circlesfera/backups ] && ! chmod 700 /srv/circlesfera/backups; then
              echo "❌ Could not restrict /srv/circlesfera/backups to the deploy user."
              exit 1
            fi
            set -a
            # shellcheck disable=SC1091
            source .env.production
            set +a
            if [ "$MKDIR_RC" -eq 0 ]; then
              BACKUP_FILE="${BACKUP_ROOT}/pre_deploy_${IMAGE_SHA:0:12}_$(date -u +%Y%m%d_%H%M%S).dump"
              if docker compose -f docker-compose.prod.yml --env-file .env.production exec -T postgres \
                pg_dump -U "${POSTGRES_USER}" -Fc "${POSTGRES_DB}" > "${BACKUP_FILE}"; then
                echo "✅ Backup written to ${BACKUP_FILE}"
              else
                echo "⚠️  Pre-deploy backup skipped/failed (continuing deploy). Ensure cron backups are configured."
                rm -f "${BACKUP_FILE}" || true
              fi

              # pre_deploy_*.dump is a short-lived per-deploy safety net (one per
              # deploy attempt, not once daily like the nightly pg_backup_*.dump
              # cron), and unlike that cron job's retention it was never pruned —
              # left unbounded, these accumulate every push to main and can fill
              # the disk. 7 days covers "did this specific deploy just break
              # something" without relying on the 30-day nightly backup's cadence.
              find "${BACKUP_ROOT}" -type f -name 'pre_deploy_*.dump' -mtime +7 -delete || true
              # Dumps taken by ops workflows (e.g. pre_secret_invalidation_*) and
              # their reports hold the same data; same 7-day retention.
              find "${BACKUP_ROOT}" -type f -name 'pre_*.dump' -mtime +7 -delete || true
              find /srv/circlesfera/backups/ops -type f -mtime +7 -delete 2>/dev/null || true
            else
              echo "⚠️  Could not create ${BACKUP_ROOT} (permission denied). Skipping pre-deploy backup."
            fi
            set -e

            # Pull SHA-tagged images (and latest for redis/postgres/nginx)
            docker compose -f docker-compose.prod.yml --env-file .env.production pull

            # Rolling recreate without full stack downtime (keep postgres/redis up).
            # Override image tags via environment if compose supports REGISTRY; pin via pull of :latest after tagging.
            docker pull "${REGISTRY}/backend:${IMAGE_SHA}"
            docker pull "${REGISTRY}/frontend:${IMAGE_SHA}"
            docker tag "${REGISTRY}/backend:${IMAGE_SHA}" "${REGISTRY}/backend:latest"
            docker tag "${REGISTRY}/frontend:${IMAGE_SHA}" "${REGISTRY}/frontend:latest"

            docker compose -f docker-compose.prod.yml --env-file .env.production up -d --no-deps --remove-orphans backend frontend nginx-proxy

            # Every deploy leaves its SHA-tagged backend/frontend images on disk
            # forever — `docker system prune -f` alone never touches them (they're
            # tagged, not dangling). Keep `:latest`, this deploy and the previous
            # one: infra/host/emergency-deploy.sh rolls back to the previous
            # images without GHCR, for when GitHub itself is down.
            cleanup_old_images() {
              for repo in backend frontend; do
                docker images "${REGISTRY}/${repo}" --format '{{.Tag}}' \
                  | grep -vxF -e latest -e "${IMAGE_SHA}" -e "${KEEP_PREV:-latest}" \
                  | xargs -r -I{} docker rmi "${REGISTRY}/${repo}:{}" >/dev/null 2>&1 || true
              done
              docker system prune -f || true
            }

            rollback() {
              echo "🔁 Rolling back to previous images..."
              if [ -n "$PREV_SHA" ]; then
                docker pull "${REGISTRY}/backend:${PREV_SHA}" || true
                docker pull "${REGISTRY}/frontend:${PREV_SHA}" || true
                docker tag "${REGISTRY}/backend:${PREV_SHA}" "${REGISTRY}/backend:latest" || true
                docker tag "${REGISTRY}/frontend:${PREV_SHA}" "${REGISTRY}/frontend:latest" || true
                # The proxy reads its configuration from this checkout, not
                # from an image: put back the one the previous version ran
                # with, and recreate the proxy so that it reads it.
                git checkout "$PREV_SHA" -- nginx/master.conf.template || true
                docker compose -f docker-compose.prod.yml --env-file .env.production up -d --no-deps backend frontend || true
                docker compose -f docker-compose.prod.yml --env-file .env.production up -d --no-deps --force-recreate nginx-proxy || true
              fi
              # Previously this only ran after a full success (bottom of script),
              # so a failed deploy never reclaimed the images/build cache its own
              # image pull just added — disk stayed full, making the next deploy
              # more likely to fail the same way. Run it on every rollback too.
              cleanup_old_images
            }

            # Poll backend health (migrate + Nest boot can take >20s)
            echo "Waiting for backend to become healthy..."
            HEALTH="starting"
            STATUS="missing"
            for i in $(seq 1 36); do
              STATUS=$(docker inspect --format='{{.State.Status}}' CircleSfera-Backend 2>/dev/null || echo "missing")
              HEALTH=$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' CircleSfera-Backend 2>/dev/null || echo "none")
              echo "  attempt $i/36 — status=$STATUS health=$HEALTH"
              if [ "$STATUS" = "running" ] && [ "$HEALTH" = "healthy" ]; then
                break
              fi
              if [ "$STATUS" = "exited" ] || [ "$STATUS" = "dead" ] || [ "$STATUS" = "missing" ]; then
                break
              fi
              sleep 5
            done

            echo "--- Backend status: $STATUS | health: $HEALTH ---"
            echo "--- Last backend logs: ---"
            docker logs CircleSfera-Backend --tail=80 2>&1 || true
            echo "--- End logs ---"

            if [ "$STATUS" != "running" ] || [ "$HEALTH" != "healthy" ]; then
              echo "❌ Backend is not healthy (status=$STATUS, health=$HEALTH). Deploy FAILED."
              rollback
              if [ -n "$DEPLOY_WEBHOOK" ]; then
                curl -X POST -H 'Content-type: application/json' --data '{"text":"🚨 *Deployment FAILED* to OVH VPS. Backend is not healthy; rollback attempted."}' "$DEPLOY_WEBHOOK" || true
              fi
              exit 1
            fi

            echo "✅ Backend is healthy."

            # Nginx caches Docker DNS for upstreams (resolver valid=30s / start-time
            # resolution). Force recreate so smoke hits the new backend IP.
            echo "Recreating nginx-proxy to refresh upstream DNS..."
            docker compose -f docker-compose.prod.yml --env-file .env.production \
              up -d --no-deps --force-recreate nginx-proxy
            sleep 3

            # API smoke: catch schema/runtime 500s that healthchecks miss (e.g. missing tables).
            # Retry briefly — nginx may still be starting after recreate.
            echo "Running post-deploy API smoke..."
            # Response bodies go to a private folder of this run. Fixed names in
            # /tmp can belong to another VPS user (sticky /tmp), and curl then
            # fails to write them, which reads as a failed check.
            SMOKE_TMP=$(mktemp -d)
            trap 'rm -rf "$SMOKE_TMP"' EXIT
            smoke_ok=1
            smoke_check() {
              path="$1"
              code="000"
              for attempt in 1 2 3 4 5; do
                code=$(curl -sS -o "$SMOKE_TMP"/cs-smoke-body -w "%{http_code}" \
                  --max-time 15 \
                  "http://127.0.0.1:8082/api/v1${path}") || code="000"
                case "$code" in
                  2*|3*|401|403|404)
                    echo "  OK  $code  $path"
                    return 0
                    ;;
                  502|503|000)
                    echo "  …  $code  $path (attempt $attempt/5, retrying)"
                    sleep 2
                    ;;
                  *)
                    break
                    ;;
                esac
              done
              echo "  FAIL $code  $path"
              head -c 400 "$SMOKE_TMP"/cs-smoke-body 2>/dev/null || true
              echo
              smoke_ok=0
            }
            smoke_check "/health"
            smoke_check "/feed/foryou?page=1&limit=2"
            smoke_check "/stories"
            smoke_check "/live/active"

            # The app links file, as Android asks for it on www: answered by
            # this version's API, through the proxy's www exception, with no
            # redirect. A 404 does not pass here.
            links="000"
            for attempt in 1 2 3 4 5; do
              links=$(curl -sS -o "$SMOKE_TMP"/cs-smoke-body -w "%{http_code} %{content_type}" --max-time 15 \
                -H "Host: www.circlesfera.com" "http://127.0.0.1:8082/.well-known/assetlinks.json") || links="000"
              case "$links" in
                502*|503*|000*) sleep 2 ;;
                *) break ;;
              esac
            done
            case "$links" in
              "200 application/json"|"200 application/json;"*)
                echo "  OK  200  www.circlesfera.com/.well-known/assetlinks.json" ;;
              *)
                echo "  FAIL $links  www.circlesfera.com/.well-known/assetlinks.json"
                head -c 400 "$SMOKE_TMP"/cs-smoke-body 2>/dev/null || true
                echo
                smoke_ok=0 ;;
            esac

            if [ "$smoke_ok" != "1" ]; then
              echo "❌ Post-deploy API smoke FAILED."
              docker logs CircleSfera-Backend --tail=100 2>&1 || true
              rollback
              if [ -n "$DEPLOY_WEBHOOK" ]; then
                curl -X POST -H 'Content-type: application/json' --data '{"text":"🚨 *Deployment FAILED* smoke: API returned 5xx after healthy check; rollback attempted."}' "$DEPLOY_WEBHOOK" || true
              fi
              exit 1
            fi
            echo "✅ Post-deploy API smoke passed."

            # Staff sites: the Admin Panel and the Backoffice are the same app
            # and API under their own host name. Each one must serve the app
            # from its own server block (the only ones whose pages deny the
            # camera, the microphone and the location), reach the API, and
            # refuse the staff session route without a session. Nobody is
            # signed in.
            echo "Running post-deploy staff sites check..."
            staff_ok=1
            staff_request() {
              code="000"
              for attempt in 1 2 3 4 5; do
                code=$(curl -sS -o "$SMOKE_TMP"/cs-staff-body -D "$SMOKE_TMP"/cs-staff-headers \
                  -w "%{http_code}" --max-time 15 \
                  -H "Host: $1" "http://127.0.0.1:8082$2") || code="000"
                case "$code" in
                  502|503|000) sleep 2 ;;
                  *) break ;;
                esac
              done
            }
            staff_fail() {
              echo "  FAIL $1"
              head -c 400 "$SMOKE_TMP"/cs-staff-body 2>/dev/null || true
              echo
              staff_ok=0
            }
            staff_site_check() {
              host="$1"
              staff_request "$host" "/"
              if [ "$code" != "200" ]; then
                staff_fail "$code  $host/"
              elif ! grep -q 'id="root"' "$SMOKE_TMP"/cs-staff-body; then
                staff_fail "$host/ is not the app"
              elif ! grep -qi '^permissions-policy:.*camera=()' "$SMOKE_TMP"/cs-staff-headers; then
                staff_fail "$host/ is not served by its own server block"
              else
                echo "  OK  $code  $host/"
              fi
              staff_request "$host" "/api/v1/health"
              if [ "$code" = "200" ]; then
                echo "  OK  $code  $host/api/v1/health"
              else
                staff_fail "$code  $host/api/v1/health"
              fi
              staff_request "$host" "/api/v1/admin-auth/me"
              if [ "$code" = "401" ]; then
                echo "  OK  $code  $host/api/v1/admin-auth/me (no session)"
              else
                staff_fail "$code  $host/api/v1/admin-auth/me (expected 401 without a session)"
              fi
            }
            staff_site_check "admin.circlesfera.com"
            staff_site_check "backoffice.circlesfera.com"

            if [ "$staff_ok" != "1" ]; then
              echo "❌ Post-deploy staff sites check FAILED."
              rollback
              if [ -n "$DEPLOY_WEBHOOK" ]; then
                curl -X POST -H 'Content-type: application/json' --data '{"text":"🚨 *Deployment FAILED* staff sites check: the Admin Panel or the Backoffice does not answer as expected; rollback attempted."}' "$DEPLOY_WEBHOOK" || true
              fi
              exit 1
            fi
            echo "✅ Post-deploy staff sites check passed."

            # The signed-in checks (sign-in, what a person must not see or
            # reach, writing and deleting a post) run on staging before this
            # deploy, with staging's own accounts: production keeps none.

            # Every public address, through the host nginx in front of the
            # proxy and with its certificate checked: the checks above ask the
            # proxy on its loopback port, so they never see which site the
            # host nginx gives a name to. A failure here is in the host nginx,
            # not in this version: it is reported and fails the run at the
            # end, without a rollback (infra/host/apply-production-site.sh).
            public_ok=1
            for address in circlesfera.com www.circlesfera.com admin.circlesfera.com backoffice.circlesfera.com; do
              code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 15 \
                --resolve "${address}:443:127.0.0.1" "https://${address}/api/v1/health") || code="000"
              if [ "$code" = "200" ]; then
                echo "  OK  $code  https://${address}/api/v1/health"
              else
                echo "  FAIL $code  https://${address}/api/v1/health"
                public_ok=0
              fi
            done
            # www sends pages to the one address, but the app links file
            # stays on www without a redirect: Android checks it there for
            # links to www and does not follow a redirect. The API's answer is
            # checked above, with a rollback; here, the host nginx's route.
            www_page=$(curl -sS -o /dev/null -w "%{http_code} %{redirect_url}" --max-time 15 \
              --resolve "www.circlesfera.com:443:127.0.0.1" "https://www.circlesfera.com/") || www_page="000"
            if [ "$www_page" = "301 https://circlesfera.com/" ]; then
              echo "  OK  301  https://www.circlesfera.com/ goes to https://circlesfera.com/"
            else
              echo "  FAIL $www_page  https://www.circlesfera.com/ should go to https://circlesfera.com/"
              public_ok=0
            fi
            links=$(curl -sS -o /dev/null -w "%{http_code} %{content_type}" --max-time 15 \
              --resolve "www.circlesfera.com:443:127.0.0.1" "https://www.circlesfera.com/.well-known/assetlinks.json") || links="000"
            case "$links" in
              "200 application/json"|"200 application/json;"*) echo "  OK  200  https://www.circlesfera.com/.well-known/assetlinks.json" ;;
              *) echo "  FAIL $links  https://www.circlesfera.com/.well-known/assetlinks.json"; public_ok=0 ;;
            esac
            if [ "$public_ok" != "1" ] && [ -n "$DEPLOY_WEBHOOK" ]; then
              curl -X POST -H 'Content-type: application/json' --data '{"text":"🚨 A public address of CircleSfera does not reach production through the host nginx. The new version stays; see the deploy log."}' "$DEPLOY_WEBHOOK" || true
            fi

            # Postgres and Redis keep running through a deploy, so a new pin
            # of theirs reaches them only through "Ops — recreate the
            # database and the cache", run by the owner. Say so when one runs
            # another image than its pin (pulled above); nothing changes here.
            data_drift=""
            for service in postgres redis; do
              running=$(docker inspect --format '{{.Image}}' \
                "$(docker compose -f docker-compose.prod.yml --env-file .env.production ps -q "$service")" 2>/dev/null || true)
              pinned=$(docker image inspect --format '{{.Id}}' \
                "$(docker compose -f docker-compose.prod.yml --env-file .env.production config --images "$service")" 2>/dev/null || true)
              if [ -z "$running" ] || [ -z "$pinned" ]; then
                echo "  ?   $service: could not compare its image with its pin"
              elif [ "$running" != "$pinned" ]; then
                echo "  NEW $service runs ${running:7:12}, its pin is ${pinned:7:12}"
                data_drift="$data_drift $service"
              else
                echo "  OK  $service runs its pinned image"
              fi
            done
            if [ -n "$data_drift" ]; then
              echo "⚠️ A new image is pinned for:$data_drift. Run \"Ops — recreate the database and the cache\" (first without apply)."
              if [ -n "$DEPLOY_WEBHOOK" ]; then
                curl -X POST -H 'Content-type: application/json' --data "{\"text\":\"ℹ️ A new image is pinned for:${data_drift}. Production keeps the old one until \\\"Ops — recreate the database and the cache\\\" is run.\"}" "$DEPLOY_WEBHOOK" || true
              fi
            fi

            # The host nginx sites of CircleSfera are kept in infra/host and
            # reach the server only through its scripts, run by the owner.
            # Say whether each live file matches the repository's: only
            # "matches" or "differs", never the files (this log is public).
            host_drift=""
            for pair in \
              "/etc/nginx/sites-available/circlesfera:infra/host/nginx/sites/circlesfera-production.conf" \
              "/etc/nginx/conf.d/circlesfera-staging.conf:infra/host/nginx/sites/circlesfera-staging.conf" \
              "/etc/nginx/conf.d/circlesfera-dev.conf:infra/host/nginx/sites/circlesfera-dev.conf"; do
              live="${pair%%:*}"; kept="${pair#*:}"
              if [ ! -r "$live" ] || [ ! -f "$kept" ]; then
                echo "  ?   $(basename "$kept"): could not compare"
              elif cmp -s "$live" "$kept"; then
                echo "  OK  $(basename "$kept") matches the server's"
              else
                echo "  DIFF $(basename "$kept") differs from the server's"
                host_drift="$host_drift $(basename "$kept")"
              fi
            done
            if [ -n "$host_drift" ]; then
              echo "⚠️ The host nginx differs from the repository for:$host_drift. A change made by hand on the server, or one not yet applied with infra/host."
              if [ -n "$DEPLOY_WEBHOOK" ]; then
                curl -X POST -H 'Content-type: application/json' --data "{\"text\":\"ℹ️ The host nginx differs from the repository for:${host_drift}.\"}" "$DEPLOY_WEBHOOK" || true
              fi
            fi

            trap - EXIT
            rm -rf "$SMOKE_TMP"
            # The version this deploy replaced, for the emergency rollback.
            if [ -n "$PREV_SHA" ] && [ "$PREV_SHA" != "$IMAGE_SHA" ]; then
              echo "${PREV_SHA}" > .deploy-sha.previous
            fi
            echo "${IMAGE_SHA}" > .deploy-sha

            # Clean up old SHA-tagged images and dangling layers
            cleanup_old_images

            if [ "$public_ok" != "1" ]; then
              echo "❌ Deployed, but a public address does not reach production through the host nginx."
              exit 1
            fi
            echo "✅ Deployment completed successfully!"
            if [ -n "$DEPLOY_WEBHOOK" ]; then
              curl -X POST -H 'Content-type: application/json' --data '{"text":"✅ *Deployment SUCCESS* to OVH VPS. All containers running."}' "$DEPLOY_WEBHOOK" || true
            fi
