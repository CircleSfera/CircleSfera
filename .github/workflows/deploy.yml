name: Deploy to OVH VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only one deploy at a time; queue instead of cancelling mid-SSH rollout.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: circlesfera/circlesfera
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NODE_OPTIONS: "--no-deprecation"

permissions:
  contents: read

jobs:
  test:
    name: Run Lint and Unit Tests
    # Prefer owner/repo@ref over `./.github/workflows/...`: the Actions language
    # service fails to resolve relative reusable workflows in this workspace
    # (path with spaces → "Unable to find reusable workflow"). Pin to main so
    # the call matches the shared gate on origin; change ci-quality.yml on main.
    uses: CircleSfera/CircleSfera/.github/workflows/ci-quality.yml@main
    secrets: inherit

  build:
    name: Build and Push Docker Images
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve frontend Vite build args
        id: vite_args
        env:
          ENV_PRODUCTION_B64: ${{ secrets.ENV_PRODUCTION_B64 }}
          SECRET_VITE_API_URL: ${{ secrets.VITE_API_URL }}
          SECRET_VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}
        run: |
          set -euo pipefail
          LIVEKIT_URL=""
          API_URL="${SECRET_VITE_API_URL:-}"
          TURNSTILE_SITE_KEY="${SECRET_VITE_TURNSTILE_SITE_KEY:-}"

          if [ -z "${ENV_PRODUCTION_B64:-}" ]; then
            echo "❌ Secret ENV_PRODUCTION_B64 is missing. Run ./scripts/upload-prod-env.sh locally."
            exit 1
          fi

          ENV_FILE="$(mktemp)"
          echo "$ENV_PRODUCTION_B64" | base64 -d > "$ENV_FILE"

          # Prefer VITE_LIVEKIT_URL; fall back to LIVEKIT_URL (same WSS endpoint).
          LIVEKIT_URL="$(
            grep -E '^(VITE_LIVEKIT_URL|LIVEKIT_URL)=' "$ENV_FILE" \
              | head -1 \
              | cut -d= -f2- \
              | sed -e 's/^"//' -e 's/"$//' -e "s/^'//" -e "s/'$//"
          )"

          if [ -z "$API_URL" ]; then
            API_URL="$(
              grep -E '^VITE_API_URL=' "$ENV_FILE" \
                | head -1 \
                | cut -d= -f2- \
                | sed -e 's/^"//' -e 's/"$//' -e "s/^'//" -e "s/'$//"
            )"
          fi

          SENTRY_DSN="$(
            grep -E '^VITE_SENTRY_DSN=' "$ENV_FILE" \
              | head -1 \
              | cut -d= -f2- \
              | sed -e 's/^"//' -e 's/"$//' -e "s/^'//" -e "s/'$//"
          )"

          if [ -z "$TURNSTILE_SITE_KEY" ]; then
            TURNSTILE_SITE_KEY="$(
              grep -E '^VITE_TURNSTILE_SITE_KEY=' "$ENV_FILE" \
                | head -1 \
                | cut -d= -f2- \
                | sed -e 's/^"//' -e 's/"$//' -e "s/^'//" -e "s/'$//"
            )"
          fi

          rm -f "$ENV_FILE"

          if [ -z "$API_URL" ]; then
            echo "❌ VITE_API_URL missing (GitHub secret VITE_API_URL or key in .env.production)."
            exit 1
          fi
          if [ -z "$LIVEKIT_URL" ]; then
            echo "❌ LIVEKIT_URL (or VITE_LIVEKIT_URL) missing in .env.production."
            echo "   Re-run ./scripts/upload-prod-env.sh after adding it."
            exit 1
          fi

          {
            echo "api_url=$API_URL"
            echo "livekit_url=$LIVEKIT_URL"
            echo "sentry_dsn=$SENTRY_DSN"
            echo "turnstile_site_key=$TURNSTILE_SITE_KEY"
          } >> "$GITHUB_OUTPUT"
          echo "✅ Vite build args resolved (API + LiveKit URL + optional Sentry + Turnstile)."

      - name: Build and push Backend
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./circlesfera-backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Frontend
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./circlesfera-frontend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:${{ github.sha }}
          build-args: |
            VITE_API_URL=${{ steps.vite_args.outputs.api_url }}
            VITE_LIVEKIT_URL=${{ steps.vite_args.outputs.livekit_url }}
            VITE_SENTRY_DSN=${{ steps.vite_args.outputs.sentry_dsn }}
            VITE_TURNSTILE_SITE_KEY=${{ steps.vite_args.outputs.turnstile_site_key }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Production
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # GITHUB_TOKEN is passed into the VPS docker login; it must be able to pull GHCR images.
    permissions:
      contents: read
      packages: read

    steps:
      - name: Execute Remote SSH Deployment
        uses: appleboy/ssh-action@v1.2.5
        env:
          ENV_PRODUCTION_B64: ${{ secrets.ENV_PRODUCTION_B64 }}
          ABUSE_HASH_PEPPER: ${{ secrets.ABUSE_HASH_PEPPER }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}
          # QA-008: authenticated post-deploy smoke. Reuses VITE_API_URL (the
          # same public HTTPS origin the frontend calls, e.g.
          # https://circlesfera.com/api/v1) rather than a new secret — the
          # internal 127.0.0.1 loopback used by the unauthenticated checks
          # below cannot carry Secure cookies, so this must be the real origin.
          # SMOKE_TEST_EMAIL/PASSWORD must both be set for the check to run
          # (see scripts/create-smoke-test-user.ts for account setup).
          SMOKE_TEST_API_URL: ${{ secrets.VITE_API_URL }}
          SMOKE_TEST_EMAIL: ${{ secrets.SMOKE_TEST_EMAIL }}
          SMOKE_TEST_PASSWORD: ${{ secrets.SMOKE_TEST_PASSWORD }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: ENV_PRODUCTION_B64,ABUSE_HASH_PEPPER,TURNSTILE_SECRET_KEY,VITE_TURNSTILE_SITE_KEY,SMOKE_TEST_API_URL,SMOKE_TEST_EMAIL,SMOKE_TEST_PASSWORD
          script: |
            set -e
            echo "Starting deployment on OVH VPS..."

            # Navigate to project directory
            cd /srv/circlesfera

            # Login to GHCR on the VPS
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Pull latest code (for docker-compose.prod.yml and nginx config)
            git fetch origin
            git reset --hard origin/main

            # Write secrets AFTER reset so they are never affected by checkout.
            # Compose interpolates ${VAR} from the project `.env` file by default;
            # service `env_file:` does NOT feed interpolation.
            if [ -n "$ENV_PRODUCTION_B64" ]; then
              echo "$ENV_PRODUCTION_B64" | base64 -d > .env.production
              echo "✅ .env.production written from secret."
            else
              echo "⚠️  WARNING: ENV_PRODUCTION_B64 secret not set. Using existing .env.production."
            fi

            if [ ! -f .env.production ]; then
              echo "❌ .env.production is missing."
              exit 1
            fi

            # Merge ABUSE_HASH_PEPPER when ENV_PRODUCTION_B64 predates ADR-0014 (avoid full env re-upload).
            if ! grep -qE '^ABUSE_HASH_PEPPER=.{32,}' .env.production; then
              if [ -n "${ABUSE_HASH_PEPPER:-}" ]; then
                printf '\nABUSE_HASH_PEPPER=%s\n' "$ABUSE_HASH_PEPPER" >> .env.production
                echo "✅ ABUSE_HASH_PEPPER merged from GitHub secret."
              fi
            fi

            if ! grep -qE '^TURNSTILE_SECRET_KEY=.' .env.production; then
              if [ -n "${TURNSTILE_SECRET_KEY:-}" ]; then
                printf 'TURNSTILE_SECRET_KEY=%s\n' "$TURNSTILE_SECRET_KEY" >> .env.production
                echo "✅ TURNSTILE_SECRET_KEY merged from GitHub secret."
              fi
            fi
            if ! grep -qE '^VITE_TURNSTILE_SITE_KEY=.' .env.production; then
              if [ -n "${VITE_TURNSTILE_SITE_KEY:-}" ]; then
                printf 'VITE_TURNSTILE_SITE_KEY=%s\n' "$VITE_TURNSTILE_SITE_KEY" >> .env.production
                echo "✅ VITE_TURNSTILE_SITE_KEY merged from GitHub secret."
              fi
            fi

            if ! grep -q '^REDIS_PASSWORD=.\+' .env.production; then
              echo "❌ REDIS_PASSWORD is missing/empty in .env.production (required for compose interpolation)."
              exit 1
            fi
            if ! grep -qE '^ABUSE_HASH_PEPPER=.{32,}' .env.production; then
              echo "❌ ABUSE_HASH_PEPPER is missing or shorter than 32 chars."
              echo "   Set GitHub secret: gh secret set ABUSE_HASH_PEPPER"
              echo "   Or add to .env.production and run: ./scripts/upload-prod-env.sh"
              exit 1
            fi
            if ! grep -qE '^TURNSTILE_SECRET_KEY=.' .env.production; then
              echo "❌ TURNSTILE_SECRET_KEY is missing in .env.production."
              echo "   Set GitHub secret: gh secret set TURNSTILE_SECRET_KEY"
              echo "   Or add to .env.production and run: ./scripts/upload-prod-env.sh"
              exit 1
            fi

            # Ensure default Compose env file exists for ${REDIS_PASSWORD} / ${POSTGRES_*} interpolation
            cp .env.production .env

            # Extract the deployment webhook directly from the .env file to bypass IDE schema warnings
            DEPLOY_WEBHOOK=$(grep '^SLACK_WEBHOOK_DEPLOYMENTS=' .env.production | cut -d '=' -f2- || echo "")

            export REGISTRY=ghcr.io/circlesfera/circlesfera
            export IMAGE_SHA="${{ github.sha }}"
            PREV_SHA=""
            if [ -f .deploy-sha ]; then
              PREV_SHA="$(cat .deploy-sha)"
            fi

            # Pre-migrate Postgres backup (best-effort; never fail the deploy).
            # Prefer a path writable by the deploy user (/srv/...), not /var/backups.
            echo "Taking pre-deploy Postgres backup..."
            set +e
            BACKUP_ROOT="/srv/circlesfera/backups/postgres"
            mkdir -p "${BACKUP_ROOT}" /srv/circlesfera/backups/etl
            MKDIR_RC=$?
            set -a
            # shellcheck disable=SC1091
            source .env.production
            set +a
            if [ "$MKDIR_RC" -eq 0 ]; then
              BACKUP_FILE="${BACKUP_ROOT}/pre_deploy_${IMAGE_SHA:0:12}_$(date -u +%Y%m%d_%H%M%S).dump"
              if docker compose -f docker-compose.prod.yml --env-file .env.production exec -T postgres \
                pg_dump -U "${POSTGRES_USER}" -Fc "${POSTGRES_DB}" > "${BACKUP_FILE}"; then
                echo "✅ Backup written to ${BACKUP_FILE}"
              else
                echo "⚠️  Pre-deploy backup skipped/failed (continuing deploy). Ensure cron backups are configured."
                rm -f "${BACKUP_FILE}" || true
              fi
            else
              echo "⚠️  Could not create ${BACKUP_ROOT} (permission denied). Skipping pre-deploy backup."
            fi
            set -e

            # Pull SHA-tagged images (and latest for redis/postgres/nginx)
            docker compose -f docker-compose.prod.yml --env-file .env.production pull

            # Rolling recreate without full stack downtime (keep postgres/redis up).
            # Override image tags via environment if compose supports REGISTRY; pin via pull of :latest after tagging.
            docker pull "${REGISTRY}/backend:${IMAGE_SHA}"
            docker pull "${REGISTRY}/frontend:${IMAGE_SHA}"
            docker tag "${REGISTRY}/backend:${IMAGE_SHA}" "${REGISTRY}/backend:latest"
            docker tag "${REGISTRY}/frontend:${IMAGE_SHA}" "${REGISTRY}/frontend:latest"

            docker compose -f docker-compose.prod.yml --env-file .env.production up -d --no-deps --remove-orphans backend frontend nginx-proxy

            rollback() {
              echo "🔁 Rolling back to previous images..."
              if [ -n "$PREV_SHA" ]; then
                docker pull "${REGISTRY}/backend:${PREV_SHA}" || true
                docker pull "${REGISTRY}/frontend:${PREV_SHA}" || true
                docker tag "${REGISTRY}/backend:${PREV_SHA}" "${REGISTRY}/backend:latest" || true
                docker tag "${REGISTRY}/frontend:${PREV_SHA}" "${REGISTRY}/frontend:latest" || true
                docker compose -f docker-compose.prod.yml --env-file .env.production up -d --no-deps backend frontend nginx-proxy || true
              fi
            }

            # Poll backend health (migrate + Nest boot can take >20s)
            echo "Waiting for backend to become healthy..."
            HEALTH="starting"
            STATUS="missing"
            for i in $(seq 1 36); do
              STATUS=$(docker inspect --format='{{.State.Status}}' CircleSfera-Backend 2>/dev/null || echo "missing")
              HEALTH=$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' CircleSfera-Backend 2>/dev/null || echo "none")
              echo "  attempt $i/36 — status=$STATUS health=$HEALTH"
              if [ "$STATUS" = "running" ] && [ "$HEALTH" = "healthy" ]; then
                break
              fi
              if [ "$STATUS" = "exited" ] || [ "$STATUS" = "dead" ] || [ "$STATUS" = "missing" ]; then
                break
              fi
              sleep 5
            done

            echo "--- Backend status: $STATUS | health: $HEALTH ---"
            echo "--- Last backend logs: ---"
            docker logs CircleSfera-Backend --tail=80 2>&1 || true
            echo "--- End logs ---"

            if [ "$STATUS" != "running" ] || [ "$HEALTH" != "healthy" ]; then
              echo "❌ Backend is not healthy (status=$STATUS, health=$HEALTH). Deploy FAILED."
              rollback
              if [ -n "$DEPLOY_WEBHOOK" ]; then
                curl -X POST -H 'Content-type: application/json' --data '{"text":"🚨 *Deployment FAILED* to OVH VPS. Backend is not healthy; rollback attempted."}' "$DEPLOY_WEBHOOK" || true
              fi
              exit 1
            fi

            echo "✅ Backend is healthy."

            # Nginx caches Docker DNS for upstreams (resolver valid=30s / start-time
            # resolution). Force recreate so smoke hits the new backend IP.
            echo "Recreating nginx-proxy to refresh upstream DNS..."
            docker compose -f docker-compose.prod.yml --env-file .env.production \
              up -d --no-deps --force-recreate nginx-proxy
            sleep 3

            # API smoke: catch schema/runtime 500s that healthchecks miss (e.g. missing tables).
            # Retry briefly — nginx may still be starting after recreate.
            echo "Running post-deploy API smoke..."
            smoke_ok=1
            smoke_check() {
              path="$1"
              code="000"
              for attempt in 1 2 3 4 5; do
                code=$(curl -sS -o /tmp/cs-smoke-body -w "%{http_code}" \
                  --max-time 15 \
                  "http://127.0.0.1:8082/api/v1${path}" || echo "000")
                case "$code" in
                  2*|3*|401|403|404)
                    echo "  OK  $code  $path"
                    return 0
                    ;;
                  502|503|000)
                    echo "  …  $code  $path (attempt $attempt/5, retrying)"
                    sleep 2
                    ;;
                  *)
                    break
                    ;;
                esac
              done
              echo "  FAIL $code  $path"
              head -c 400 /tmp/cs-smoke-body 2>/dev/null || true
              echo
              smoke_ok=0
            }
            smoke_check "/health"
            smoke_check "/feed/foryou?page=1&limit=2"
            smoke_check "/stories"
            smoke_check "/live/active"

            if [ "$smoke_ok" != "1" ]; then
              echo "❌ Post-deploy API smoke FAILED."
              docker logs CircleSfera-Backend --tail=100 2>&1 || true
              rollback
              if [ -n "$DEPLOY_WEBHOOK" ]; then
                curl -X POST -H 'Content-type: application/json' --data '{"text":"🚨 *Deployment FAILED* smoke: API returned 5xx after healthy check; rollback attempted."}' "$DEPLOY_WEBHOOK" || true
              fi
              exit 1
            fi
            echo "✅ Post-deploy API smoke passed."

            # QA-008: authenticated smoke — login + CSRF + create/delete one PRIVATE
            # post as a dedicated low-privilege test account (scripts/create-smoke-test-user.ts).
            # Runs against the public HTTPS origin: access_token/CSRF cookies are
            # Secure-flagged in production and curl will not resend a Secure cookie
            # over the plain-http loopback used by the checks above.
            if [ -n "${SMOKE_TEST_API_URL:-}" ] && [ -n "${SMOKE_TEST_EMAIL:-}" ] && [ -n "${SMOKE_TEST_PASSWORD:-}" ]; then
              echo "Running post-deploy authenticated smoke..."
              auth_smoke_ok=1
              SMOKE_JAR=$(mktemp)
              SMOKE_POST_ID=""

              cleanup_smoke_post() {
                if [ -n "$SMOKE_POST_ID" ]; then
                  curl -sS -o /dev/null -b "$SMOKE_JAR" \
                    -H "x-csrf-token: ${SMOKE_CSRF_TOKEN:-}" \
                    -X DELETE "${SMOKE_TEST_API_URL}/posts/${SMOKE_POST_ID}" || true
                fi
                rm -f "$SMOKE_JAR"
              }
              trap cleanup_smoke_post EXIT

              csrf_body=$(curl -sS -c "$SMOKE_JAR" "${SMOKE_TEST_API_URL}/csrf-token")
              SMOKE_CSRF_TOKEN=$(echo "$csrf_body" | grep -o '"csrfToken":"[^"]*"' | cut -d'"' -f4)

              if [ -z "$SMOKE_CSRF_TOKEN" ]; then
                echo "  FAIL  could not obtain CSRF token"
                auth_smoke_ok=0
              else
                login_code=$(curl -sS -o /tmp/cs-auth-login -w "%{http_code}" \
                  -b "$SMOKE_JAR" -c "$SMOKE_JAR" \
                  -H "x-csrf-token: $SMOKE_CSRF_TOKEN" -H "Content-Type: application/json" \
                  -d "{\"identifier\":\"${SMOKE_TEST_EMAIL}\",\"password\":\"${SMOKE_TEST_PASSWORD}\"}" \
                  "${SMOKE_TEST_API_URL}/auth/login")
                if [ "$login_code" != "200" ]; then
                  echo "  FAIL  login ($login_code)"
                  head -c 400 /tmp/cs-auth-login; echo
                  auth_smoke_ok=0
                else
                  echo "  OK    login"
                  # Re-fetch: the CSRF token above is bound to the pre-login (anonymous)
                  # session identifier and will not validate authenticated requests.
                  csrf_body=$(curl -sS -b "$SMOKE_JAR" -c "$SMOKE_JAR" "${SMOKE_TEST_API_URL}/csrf-token")
                  SMOKE_CSRF_TOKEN=$(echo "$csrf_body" | grep -o '"csrfToken":"[^"]*"' | cut -d'"' -f4)

                  create_code=$(curl -sS -o /tmp/cs-auth-create -w "%{http_code}" \
                    -b "$SMOKE_JAR" -c "$SMOKE_JAR" \
                    -H "x-csrf-token: $SMOKE_CSRF_TOKEN" -H "Content-Type: application/json" \
                    -d '{"caption":"CircleSfera post-deploy smoke check — safe to ignore, auto-deleted.","visibility":"PRIVATE"}' \
                    "${SMOKE_TEST_API_URL}/posts")
                  if [ "$create_code" = "403" ] && grep -q "CONTENT_POSTING_DISABLED" /tmp/cs-auth-create; then
                    echo "  SKIP  create post: content posting is intentionally disabled (system setting)"
                  elif [ "$create_code" != "201" ]; then
                    echo "  FAIL  create post ($create_code)"
                    head -c 400 /tmp/cs-auth-create; echo
                    auth_smoke_ok=0
                  else
                    echo "  OK    create post"
                    SMOKE_POST_ID=$(grep -o '"id":"[^"]*"' /tmp/cs-auth-create | head -1 | cut -d'"' -f4)
                    if [ -z "$SMOKE_POST_ID" ]; then
                      echo "  FAIL  could not parse created post id"
                      auth_smoke_ok=0
                    else
                      delete_code=$(curl -sS -o /tmp/cs-auth-delete -w "%{http_code}" \
                        -b "$SMOKE_JAR" \
                        -H "x-csrf-token: $SMOKE_CSRF_TOKEN" \
                        -X DELETE "${SMOKE_TEST_API_URL}/posts/${SMOKE_POST_ID}")
                      if [ "$delete_code" != "204" ]; then
                        echo "  FAIL  delete post ($delete_code)"
                        head -c 400 /tmp/cs-auth-delete; echo
                        auth_smoke_ok=0
                      else
                        echo "  OK    delete post"
                        SMOKE_POST_ID=""
                      fi
                    fi
                  fi
                fi
              fi

              trap - EXIT
              cleanup_smoke_post

              if [ "$auth_smoke_ok" != "1" ]; then
                echo "❌ Post-deploy authenticated smoke FAILED."
                rollback
                if [ -n "$DEPLOY_WEBHOOK" ]; then
                  curl -X POST -H 'Content-type: application/json' --data '{"text":"🚨 *Deployment FAILED* authenticated smoke: login/write path broken; rollback attempted."}' "$DEPLOY_WEBHOOK" || true
                fi
                exit 1
              fi
              echo "✅ Post-deploy authenticated smoke passed."
            else
              echo "⚠️  SMOKE_TEST_API_URL/SMOKE_TEST_EMAIL/SMOKE_TEST_PASSWORD not set — skipping authenticated smoke (QA-008 not enforced)."
            fi

            echo "${IMAGE_SHA}" > .deploy-sha

            # Clean up dangling images
            docker system prune -f

            echo "✅ Deployment completed successfully!"
            if [ -n "$DEPLOY_WEBHOOK" ]; then
              curl -X POST -H 'Content-type: application/json' --data '{"text":"✅ *Deployment SUCCESS* to OVH VPS. All containers running."}' "$DEPLOY_WEBHOOK" || true
            fi
