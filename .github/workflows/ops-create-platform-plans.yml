name: Ops — create the platform plans

# One-shot data change approved by the owner: production has no Platform
# Plans, so GET /payments/plans returns an empty list and nobody can
# subscribe. Creates the three plans with the live Stripe product and price
# ids (same values as prisma/seed.ts, confirmed by the owner in the Stripe
# dashboard). Takes a database backup first; existing plans are left
# untouched (ON CONFLICT DO NOTHING). Prints the catalog before and after
# (public data). Delete this workflow after the run.
on:
  workflow_dispatch: {}

# Shares the deploy-production queue so it never runs during a deploy. GitHub
# keeps only one *pending* run per queue: do not merge while it is pending.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  create:
    name: Create Premium, Elite Creator and Business
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production-ops
    steps:
      - name: Require the pinned VPS host key
        # Fail closed: without the fingerprint, the SSH step would not verify
        # that it is talking to the real VPS.
        env:
          VPS_SSH_FINGERPRINT: ${{ secrets.VPS_SSH_FINGERPRINT }}
        run: |
          if [ -z "$VPS_SSH_FINGERPRINT" ]; then
            echo "The VPS_SSH_FINGERPRINT secret is not set; refusing to connect."
            exit 1
          fi
      - name: Back up and create on the VPS
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # Verifies the server identity (SHA256 host key fingerprint).
          fingerprint: ${{ secrets.VPS_SSH_FINGERPRINT }}
          script: |
            set -euo pipefail
            cd /srv/circlesfera
            DC="docker compose -f docker-compose.prod.yml --env-file .env.production"
            BACKUP_ROOT=/srv/circlesfera/backups/postgres
            mkdir -p "$BACKUP_ROOT"
            BACKUP_FILE="$BACKUP_ROOT/pre_create_plans_$(date -u +%Y%m%d_%H%M%S).dump"
            $DC exec -T postgres sh -c 'pg_dump -U "$POSTGRES_USER" -Fc "$POSTGRES_DB"' > "$BACKUP_FILE"
            echo "Backup written ($(du -h "$BACKUP_FILE" | cut -f1))"

            $DC exec -T postgres sh -c 'psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -A -F " | " <<SQL
            SELECT name, "priceCents", "isActive" FROM platform_plans ORDER BY "priceCents";
            BEGIN;
            INSERT INTO platform_plans
              (id, name, description, "priceCents", currency, interval,
               "stripeProductId", "stripePriceId", features, "isActive", "updatedAt")
            VALUES
              (gen_random_uuid(), '\''Premium'\'',
               '\''Insignia de verificación, Analíticas básicas y Soporte prioritario.'\'',
               999, '\''EUR'\'', '\''month'\'',
               '\''prod_UtQGHGBnYo5yGX'\'', '\''price_1TtdPZIEniBX3suALJ68LF3d'\'',
               ARRAY['\''verified_badge'\'', '\''basic_analytics'\'', '\''priority_support'\''],
               true, now()),
              (gen_random_uuid(), '\''Elite Creator'\'',
               '\''Herramientas Pro de crecimiento, Insights de audiencia y Spotlight.'\'',
               1999, '\''EUR'\'', '\''month'\'',
               '\''prod_UtQG21Jd98Vidi'\'', '\''price_1TtdPZIEniBX3suAnR6uNNsN'\'',
               ARRAY['\''pro_growth_tools'\'', '\''audience_insights'\'', '\''profile_spotlight'\'', '\''verified_badge'\''],
               true, now()),
              (gen_random_uuid(), '\''Business'\'',
               '\''Verificación de negocio, Gestión multi-cuenta y Soporte 24/7 dedicado.'\'',
               4999, '\''EUR'\'', '\''month'\'',
               '\''prod_UtQGy36G3SscjF'\'', '\''price_1TtdPaIEniBX3suAm9IfVW1o'\'',
               ARRAY['\''business_verification'\'', '\''multi_account'\'', '\''dedicated_support'\'', '\''api_access_beta'\''],
               true, now())
            ON CONFLICT ("stripeProductId") DO NOTHING;
            COMMIT;
            SELECT name, "priceCents", "isActive" FROM platform_plans ORDER BY "priceCents";
            SQL'
