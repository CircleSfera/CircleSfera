name: Ops — CSP report summary

# Summarises the Content-Security-Policy violation reports the backend has
# counted (report-only mode), so the policy can be made enforcing without
# breaking the app. Read-only: it only reads the daily counters in Redis.
# Actions logs are public, so it prints only the directive, the blocked origin
# and a count. Page paths are never printed: they can contain usernames.
on:
  workflow_dispatch: {}

# Shares the deploy-production queue so it never runs during a deploy. GitHub
# keeps only one *pending* run per queue: do not merge while it is pending.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  summary:
    name: Summarise CSP violation reports
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production-ops
    steps:
      - name: Require the pinned VPS host key
        # Fail closed: without the fingerprint, the SSH step would not verify
        # that it is talking to the real VPS.
        env:
          VPS_SSH_FINGERPRINT: ${{ secrets.VPS_SSH_FINGERPRINT }}
        run: |
          if [ -z "$VPS_SSH_FINGERPRINT" ]; then
            echo "The VPS_SSH_FINGERPRINT secret is not set; refusing to connect."
            exit 1
          fi
      - name: Count violations by directive and blocked origin
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # Verifies the server identity (SHA256 host key fingerprint).
          fingerprint: ${{ secrets.VPS_SSH_FINGERPRINT }}
          command_timeout: 5m
          script: |
            set -euo pipefail
            cd /srv/circlesfera
            DC="docker compose -f docker-compose.prod.yml --env-file .env.production"
            # The backend counts reports per UTC day in Redis
            # (csp:reports:YYYY-MM-DD, kept 35 days), so deploys do not reset
            # the window the way container logs did. The password reaches
            # redis-cli through the environment, never the command line.
            REDISCLI_AUTH=$(grep '^REDIS_PASSWORD=' .env.production | head -n 1 | cut -d= -f2- | sed -E 's/^["'\'']|["'\'']$//g')
            export REDISCLI_AUTH
            RC="$DC exec -T -e REDISCLI_AUTH redis redis-cli --no-auth-warning"
            # A failed read must fail the run, not report zero violations.
            if ! KEYS=$($RC --scan --pattern 'csp:reports:*' | sort); then
              echo "Could not read the CSP counters from Redis."
              exit 1
            fi
            if [ -z "$KEYS" ]; then
              echo "No CSP violation reports in the last 35 days."
              exit 0
            fi
            echo "Days with reports: $(printf '%s\n' "$KEYS" | wc -l | tr -d ' ') ($(printf '%s\n' "$KEYS" | head -n 1 | cut -d: -f3) to $(printf '%s\n' "$KEYS" | tail -n 1 | cut -d: -f3))"
            ROWS=$(for k in $KEYS; do $RC HGETALL "$k"; done | paste - - \
              | awk -F'\t' '{c[$1]+=$2} END {for (f in c) print c[f] "\t" f}' | sort -rn)
            echo "Total CSP violation reports: $(printf '%s\n' "$ROWS" | awk -F'\t' '{t+=$1} END {print t+0}')"
            echo "count | disposition | directive | blocked origin"
            printf '%s\n' "$ROWS" | head -n 60 | awk -F'\t' '{split($2, a, "|"); print $1 " | " a[1] " | " a[2] " | " a[3]}'
