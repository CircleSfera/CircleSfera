name: Ops — delete smoke accounts

# Production keeps no smoke accounts: the signed-in smoke check runs on
# staging. This schedules for deletion, now, the smoke account and the three
# fixtures it used in production (circlesfera-backend/scripts/
# delete-smoke-accounts.ts); the daily purge of expired accounts then deletes
# them with all they hold. Only Test Accounts are touched. It runs as a dry
# run and only prints what it would do, unless `apply` is ticked.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: Schedule the deletion (leave unticked to only print what would change)
        type: boolean
        default: false

# Shares the deploy-production queue so it never runs during a deploy. GitHub
# keeps only one *pending* run per queue: if a deploy is triggered (merge to
# main) while this run waits for approval or for a running deploy, the newer
# deploy replaces it and this run is cancelled. Do not merge while it is
# pending; re-run it if it was cancelled.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  delete-smoke-accounts:
    name: Delete the smoke accounts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production-ops
    steps:
      - name: Require the pinned VPS host key
        # Fail closed: without the fingerprint, the SSH step would not verify
        # that it is talking to the real VPS.
        env:
          VPS_SSH_FINGERPRINT: ${{ secrets.VPS_SSH_FINGERPRINT }}
        run: |
          if [ -z "$VPS_SSH_FINGERPRINT" ]; then
            echo "The VPS_SSH_FINGERPRINT secret is not set; refusing to connect."
            exit 1
          fi
      - name: Schedule the deletion on the VPS
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          APPLY: ${{ inputs.apply && '1' || '0' }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # Verifies the server identity (SHA256 host key fingerprint).
          fingerprint: ${{ secrets.VPS_SSH_FINGERPRINT }}
          envs: APPLY
          script: |
            set -euo pipefail
            cd /srv/circlesfera
            docker compose -f docker-compose.prod.yml --env-file .env.production exec -T \
              -e APPLY \
              backend node scripts/delete-smoke-accounts.ts
