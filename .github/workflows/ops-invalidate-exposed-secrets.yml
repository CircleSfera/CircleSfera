name: Ops — invalidate exposed user secrets

# One-off remediation for the User-row exposure (PRs #142, #143, #145).
# Runs scripts/invalidate-exposed-user-secrets.ts inside the production backend
# container. Does not deploy images. The log shows counts only, never values.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run only prints counts. apply changes production data."
        type: choice
        options:
          - dry-run
          - apply
        default: dry-run
      confirm:
        description: 'Required for apply: type FORCE-RESET'
        type: string
        default: ""
      exposed_before:
        description: "Accounts created before this UTC instant are treated as exposed (default: when the fix reached production)"
        type: string
        default: "2026-10-02T22:20:00Z"

# Never overlap with a deploy: the backend container is recreated mid-rollout.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  remediate:
    name: Invalidate exposed secrets (${{ inputs.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Add required reviewers to this environment in the repository settings to
    # demand an approval before the job can reach the VPS.
    environment: production-ops
    steps:
      - name: Validate inputs
        env:
          MODE: ${{ inputs.mode }}
          CONFIRM: ${{ inputs.confirm }}
          EXPOSED_BEFORE: ${{ inputs.exposed_before }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$EXPOSED_BEFORE" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$'; then
            echo "exposed_before must look like 2026-10-02T22:20:00Z"
            exit 1
          fi
          if [ "$MODE" = "apply" ] && [ "$CONFIRM" != "FORCE-RESET" ]; then
            echo "apply requires typing FORCE-RESET in the confirm field"
            exit 1
          fi

      - name: Run remediation on the VPS
        uses: appleboy/ssh-action@v1.2.5
        env:
          MODE: ${{ inputs.mode }}
          EXPOSED_BEFORE: ${{ inputs.exposed_before }}
          SMOKE_TEST_EMAIL: ${{ secrets.SMOKE_TEST_EMAIL }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: MODE,EXPOSED_BEFORE,SMOKE_TEST_EMAIL
          script: |
            set -euo pipefail
            cd /srv/circlesfera
            COMPOSE="docker compose -f docker-compose.prod.yml --env-file .env.production"

            if [ -z "${SMOKE_TEST_EMAIL:-}" ]; then
              echo "SMOKE_TEST_EMAIL secret is not set; refusing to run (the deploy smoke account must be excluded)."
              exit 1
            fi

            # The smoke account must keep logging in, or the next deploy fails.
            ARGS="--exposed-before=${EXPOSED_BEFORE} --exclude-email=${SMOKE_TEST_EMAIL}"

            echo "=== Dry run ==="
            $COMPOSE exec -T backend node scripts/invalidate-exposed-user-secrets.ts $ARGS

            if [ "${MODE}" != "apply" ]; then
              echo "mode=dry-run: nothing was changed."
              exit 0
            fi

            echo "=== Pre-change Postgres dump ==="
            mkdir -p /srv/circlesfera/backups/postgres
            set -a
            # shellcheck disable=SC1091
            source .env.production
            set +a
            DUMP="/srv/circlesfera/backups/postgres/pre_secret_invalidation_$(date -u +%Y%m%d_%H%M%S).dump"
            $COMPOSE exec -T postgres pg_dump -U "${POSTGRES_USER}" -Fc "${POSTGRES_DB}" > "${DUMP}"
            chmod 600 "${DUMP}"
            echo "Dump written: ${DUMP}"

            echo "=== Apply ==="
            $COMPOSE exec -T backend node scripts/invalidate-exposed-user-secrets.ts \
              --apply --force-password-reset $ARGS

            echo "=== Post-apply state ==="
            $COMPOSE exec -T backend node scripts/invalidate-exposed-user-secrets.ts $ARGS
