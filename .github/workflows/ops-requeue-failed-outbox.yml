name: Ops — requeue failed outbox events

# Puts back to be published the outbox events that failed for good because
# the queue refused the id of their job: data exports people asked for and
# clean-ups of the media of deleted content. Events that failed for any other
# reason are not touched. It runs as a dry run and only prints how many there
# are, by kind, unless `apply` is ticked. It prints counts and dates only.
# Run it after the fix of the job ids is deployed; before that the events
# would fail again.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: Put the events back (leave unticked to only print how many there are)
        type: boolean
        default: false

# Shares the deploy-production queue so it never runs during a deploy. GitHub
# keeps only one *pending* run per queue: if a deploy is triggered (merge to
# main) while this run waits for approval or for a running deploy, the newer
# deploy replaces it and this run is cancelled. Do not merge while it is
# pending; re-run it if it was cancelled.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  requeue-failed-outbox:
    name: Requeue failed outbox events
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production-ops
    steps:
      - name: Require the pinned VPS host key
        # Fail closed: without the fingerprint, the SSH step would not verify
        # that it is talking to the real VPS.
        env:
          VPS_SSH_FINGERPRINT: ${{ secrets.VPS_SSH_FINGERPRINT }}
        run: |
          if [ -z "$VPS_SSH_FINGERPRINT" ]; then
            echo "The VPS_SSH_FINGERPRINT secret is not set; refusing to connect."
            exit 1
          fi
      - name: Requeue the failed outbox events on the VPS
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          APPLY: ${{ inputs.apply && '1' || '0' }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # Verifies the server identity (SHA256 host key fingerprint).
          fingerprint: ${{ secrets.VPS_SSH_FINGERPRINT }}
          envs: APPLY
          script: |
            set -euo pipefail
            cd /srv/circlesfera
            docker compose -f docker-compose.prod.yml --env-file .env.production exec -T \
              -e APPLY \
              backend node scripts/requeue-failed-outbox.ts
