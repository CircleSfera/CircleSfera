name: Ops — rotate smoke test password

# Applies the current SMOKE_TEST_PASSWORD secret to the post-deploy smoke-test
# account in production. Rotation: set a new SMOKE_TEST_PASSWORD secret, then run
# this workflow before the next deploy, or that deploy's smoke check fails.
on:
  workflow_dispatch: {}

# Never overlap with a deploy: the deploy smoke check logs in with this account.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  rotate:
    name: Rotate smoke test password
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production-ops
    steps:
      - name: Apply the secret on the VPS
        uses: appleboy/ssh-action@v1.2.5
        env:
          SMOKE_TEST_EMAIL: ${{ secrets.SMOKE_TEST_EMAIL }}
          SMOKE_TEST_PASSWORD: ${{ secrets.SMOKE_TEST_PASSWORD }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: SMOKE_TEST_EMAIL,SMOKE_TEST_PASSWORD
          script: |
            set -euo pipefail
            cd /srv/circlesfera
            if [ -z "${SMOKE_TEST_EMAIL:-}" ] || [ -z "${SMOKE_TEST_PASSWORD:-}" ]; then
              echo "SMOKE_TEST_EMAIL and SMOKE_TEST_PASSWORD secrets must be set."
              exit 1
            fi
            # -e NAME without a value passes the variable from this shell, so the
            # password never appears in a command line.
            docker compose -f docker-compose.prod.yml --env-file .env.production exec -T \
              -e SMOKE_TEST_EMAIL -e SMOKE_TEST_PASSWORD \
              backend node scripts/rotate-smoke-test-password.ts
