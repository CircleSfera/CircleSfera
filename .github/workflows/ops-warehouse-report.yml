name: Ops — analytics warehouse report

# Shows what the analytics warehouse (ADR-0016) holds: for each table, its
# rows, its size, and the newest row, so a load can be seen to have
# happened without reading any log (more rows, or a newer updatedAt). Read-only: it changes nothing. Actions
# logs are public, so it prints only table names, counts, sizes and dates,
# never a row, an id or a setting. It also shows, from the backend, whether
# the warehouse address is set (set or unset only) and how many rows each of
# the last three nightly exports wrote, so an empty table can be told from a
# load that did not happen. And whether the backend can write its export
# folder, and the nightly job's counts in its queue with the first line of
# its last failure (an error message, no data). The ClickHouse password is read inside
# its own container and never leaves it.
on:
  workflow_dispatch: {}

# Its own queue: it never waits for a deploy, and never takes the place of
# one in the deploy-production queue.
concurrency:
  group: warehouse-report
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  report:
    name: Report the warehouse
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production-ops
    steps:
      - name: Require the pinned VPS host key
        # Fail closed: without the fingerprint, the SSH step would not verify
        # that it is talking to the real VPS.
        env:
          VPS_SSH_FINGERPRINT: ${{ secrets.VPS_SSH_FINGERPRINT }}
        run: |
          if [ -z "$VPS_SSH_FINGERPRINT" ]; then
            echo "The VPS_SSH_FINGERPRINT secret is not set; refusing to connect."
            exit 1
          fi
      - name: Rows, size and newest row of each table
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # Verifies the server identity (SHA256 host key fingerprint).
          fingerprint: ${{ secrets.VPS_SSH_FINGERPRINT }}
          command_timeout: 5m
          script: |
            set -euo pipefail
            echo "== Container"
            docker inspect -f '{{.Name}} {{.State.Status}} health={{if .State.Health}}{{.State.Health.Status}}{{end}}' CircleSfera-ClickHouse
            echo "== Tables (every table, empty ones included)"
            # last_part_change moves with background merges too: it is not a
            # sign of a load. A load shows as more rows, or a newer updatedAt.
            docker exec CircleSfera-ClickHouse sh -c 'clickhouse-client --user "$CLICKHOUSE_USER" --password "$CLICKHOUSE_PASSWORD" --database "$CLICKHOUSE_DB" --format PrettyCompactMonoBlock --query "
              SELECT t.name AS table, ifNull(p.rows, 0) AS rows, formatReadableSize(ifNull(p.bytes, 0)) AS size, p.last_change AS last_part_change
              FROM system.tables AS t
              LEFT JOIN (
                SELECT table, sum(rows) AS rows, sum(bytes_on_disk) AS bytes, max(modification_time) AS last_change
                FROM system.parts WHERE database = currentDatabase() AND active GROUP BY table
              ) AS p ON p.table = t.name
              WHERE t.database = currentDatabase()
              ORDER BY t.name"'
            echo "== Newest row of each table"
            for t in reports appeals support_tickets transactions feature_flags; do
              printf '%s\t' "$t"
              docker exec -e T="$t" CircleSfera-ClickHouse sh -c 'clickhouse-client --user "$CLICKHOUSE_USER" --password "$CLICKHOUSE_PASSWORD" --database "$CLICKHOUSE_DB" --query "SELECT count(), max(updatedAt) FROM $T FORMAT TSV"'
            done
            echo "== The backend's side"
            # Only whether the address is set, never its value.
            docker exec CircleSfera-Backend sh -c '[ -n "${CLICKHOUSE_URL:-}" ] && echo "CLICKHOUSE_URL: set" || echo "CLICKHOUSE_URL: unset"'
            echo "== The last nightly exports (folder, then rows of each CSV, header left out)"
            docker exec CircleSfera-Backend sh -c '
              root=/app/circlesfera-backend/backups/etl
              ls -1 "$root" 2>/dev/null | grep -E "^[0-9]{4}-[0-9]{2}-[0-9]{2}T" | sort | tail -3 | while read -r d; do
                printf "%s" "$d"
                for f in "$root/$d"/*.csv; do
                  [ -e "$f" ] || continue
                  printf "  %s=%s" "$(basename "$f" .csv)" "$(( $(wc -l < "$f") - 1 ))"
                done
                echo
              done'
            echo "== The export folder, as the backend sees it"
            docker exec CircleSfera-Backend sh -c '
              root=/app/circlesfera-backend/backups/etl
              if [ ! -d "$root" ]; then echo "missing"; elif [ -w "$root" ]; then echo "present, writable"; else echo "present, NOT writable by the backend"; fi'
            echo "== The nightly job in its queue (counts, and the first line of the last failure)"
            docker exec CircleSfera-Redis sh -c '
              r() { redis-cli -a "$REDIS_PASSWORD" --no-auth-warning "$@"; }
              echo "completed: $(r ZCARD bull:warehouse-export:completed)  failed: $(r ZCARD bull:warehouse-export:failed)  scheduled: $(r ZCARD bull:warehouse-export:delayed)"
              last=$(r ZREVRANGE bull:warehouse-export:failed 0 0)
              if [ -n "$last" ]; then
                echo "last failure: $(r HGET "bull:warehouse-export:$last" failedReason | head -n 1 | cut -c1-200)"
              fi'
