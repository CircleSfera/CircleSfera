name: Ops — analytics warehouse report

# Shows what the analytics warehouse (ADR-0016) holds: for each table, its
# rows, its size, and the newest row, so a load can be seen to have
# happened without reading any log. Read-only: it changes nothing. Actions
# logs are public, so it prints only table names, counts, sizes and dates,
# never a row, an id or a setting. The ClickHouse password is read inside
# its own container and never leaves it.
on:
  workflow_dispatch: {}

# Its own queue: it never waits for a deploy, and never takes the place of
# one in the deploy-production queue.
concurrency:
  group: warehouse-report
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  report:
    name: Report the warehouse
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production-ops
    steps:
      - name: Require the pinned VPS host key
        # Fail closed: without the fingerprint, the SSH step would not verify
        # that it is talking to the real VPS.
        env:
          VPS_SSH_FINGERPRINT: ${{ secrets.VPS_SSH_FINGERPRINT }}
        run: |
          if [ -z "$VPS_SSH_FINGERPRINT" ]; then
            echo "The VPS_SSH_FINGERPRINT secret is not set; refusing to connect."
            exit 1
          fi
      - name: Rows, size and newest row of each table
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # Verifies the server identity (SHA256 host key fingerprint).
          fingerprint: ${{ secrets.VPS_SSH_FINGERPRINT }}
          command_timeout: 5m
          script: |
            set -euo pipefail
            echo "== Container"
            docker inspect -f '{{.Name}} {{.State.Status}} health={{if .State.Health}}{{.State.Health.Status}}{{end}}' CircleSfera-ClickHouse
            echo "== Tables"
            docker exec CircleSfera-ClickHouse sh -c 'clickhouse-client --user "$CLICKHOUSE_USER" --password "$CLICKHOUSE_PASSWORD" --database "$CLICKHOUSE_DB" --format PrettyCompactMonoBlock --query "
              SELECT table, sum(rows) AS rows, formatReadableSize(sum(bytes_on_disk)) AS size, max(modification_time) AS last_written
              FROM system.parts
              WHERE database = currentDatabase() AND active
              GROUP BY table ORDER BY table"'
            echo "== Newest row of each table"
            for t in reports appeals support_tickets transactions; do
              printf '%s\t' "$t"
              docker exec -e T="$t" CircleSfera-ClickHouse sh -c 'clickhouse-client --user "$CLICKHOUSE_USER" --password "$CLICKHOUSE_PASSWORD" --database "$CLICKHOUSE_DB" --query "SELECT count(), max(updatedAt) FROM $T FORMAT TSV"'
            done
