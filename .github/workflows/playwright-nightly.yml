name: Playwright Nightly

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NODE_OPTIONS: '--no-deprecation'

permissions:
  contents: read

jobs:
  e2e:
    name: Full Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: prisma
          POSTGRES_PASSWORD: prisma
          POSTGRES_DB: circlesfera_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prisma -d circlesfera_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://prisma:prisma@localhost:5432/circlesfera_e2e
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      NODE_ENV: test
      PORT: 3005
      JWT_SECRET: ci-nightly-jwt-secret-not-for-production-use-only-testing-1234567890
      JWT_REFRESH_SECRET: ci-nightly-refresh-secret-not-for-production-use-only-testing-0987654321
      CSRF_SECRET: ci-nightly-csrf-secret-not-for-production-use-only-testing-abcdefghijklmno
      ENCRYPTION_KEY: test-encryption-key-32-characters!!
      STRIPE_SECRET_KEY: sk_test_dummy
      STRIPE_WEBHOOK_SECRET: whsec_dummy
      CLOUDINARY_NAME: dummy
      CLOUDINARY_API_KEY: dummy
      CLOUDINARY_API_SECRET: dummy
      CORS_ORIGIN: http://localhost:5173
      BASE_URL: http://localhost:5173
      BACKEND_URL: http://localhost:3005/api/v1
      SKIP_GLOBAL_SETUP: 'false'
      CI: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # secrets cannot appear in job/step `if:` — check in a shell step and fail loudly.
      - name: Require E2E secrets
        env:
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
        run: |
          if [ -z "$E2E_USER_EMAIL" ] || [ -z "$E2E_USER_PASSWORD" ]; then
            echo "::error::Missing required secrets E2E_USER_EMAIL and/or E2E_USER_PASSWORD."
            echo "Configure them in the repository secrets so nightly authenticated Playwright can run."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm install

      - name: "Shared: Install and Build"
        run: |
          cd circlesfera-shared
          npm install
          npm run build

      - name: "Backend: Install, Migrate and Build"
        run: |
          cd circlesfera-backend
          npm install
          npx prisma generate
          npx prisma migrate deploy
          npm run build

      - name: "Frontend: Install Dependencies"
        run: |
          cd circlesfera-frontend
          # vite lives in devDependencies — never omit them under NODE_ENV=test
          npm install --include=dev

      - name: Start backend in background
        run: |
          cd circlesfera-backend
          nohup node dist/main.js > /tmp/backend.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sS -o /dev/null "http://localhost:3005/api/v1/csrf-token"; then
              echo "Backend is up."
              exit 0
            fi
            sleep 2
          done
          echo "Backend failed to start in time."
          cat /tmp/backend.log
          exit 1

      - name: Start frontend in background
        run: |
          cd circlesfera-frontend
          nohup npm run dev > /tmp/frontend.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sS -o /dev/null "http://localhost:5173"; then
              echo "Frontend is up."
              exit 0
            fi
            sleep 2
          done
          echo "Frontend failed to start in time."
          cat /tmp/frontend.log
          exit 1

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E
        env:
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
          PLAYWRIGHT_SKIP_WEBSERVER: 'true'
        run: |
          export E2E_USER_USERNAME="${E2E_USER_USERNAME:-e2euser}"
          export E2E_USER_FULL_NAME="${E2E_USER_FULL_NAME:-E2E Test User}"
          npm run test:e2e

      - name: Dump backend logs on failure
        if: failure()
        run: |
          echo "=== backend ==="
          cat /tmp/backend.log || true
          echo "=== frontend ==="
          cat /tmp/frontend.log || true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-nightly
          path: playwright-report/
          retention-days: 7
