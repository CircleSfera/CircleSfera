name: Playwright Nightly

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NODE_OPTIONS: '--no-deprecation'

permissions:
  contents: read
  # The pinned images the jobs start from are kept in this repository's
  # own registry.
  packages: read

jobs:
  e2e:
    name: Full Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # The job runs inside the Playwright image, which already has the browser
    # and its system packages, so nothing is downloaded for them. The tag must
    # match the @playwright/test version in package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:7852dc5a7d72f5fe458a597d690f6c42fbc8e9e26ddfa95f8e6ef552558d9bbf
      options: --user 1001 --ipc=host
    services:
      postgres:
        # Our own copy of the pinned image (see "Ops — copy pinned images").
        image: ghcr.io/circlesfera/circlesfera/mirror/pgvector:pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          POSTGRES_USER: prisma
          POSTGRES_PASSWORD: prisma
          POSTGRES_DB: circlesfera_e2e
        options: >-
          --health-cmd "pg_isready -U prisma -d circlesfera_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        # Our own copy of the pinned image (see "Ops — copy pinned images"):
        # the public mirror stops serving it once its daily allowance is used.
        image: ghcr.io/circlesfera/circlesfera/mirror/redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Inside the job container the services answer by their name.
      DATABASE_URL: postgresql://prisma:prisma@postgres:5432/circlesfera_e2e
      REDIS_HOST: redis
      REDIS_PORT: 6379
      NODE_ENV: test
      PORT: 3005
      JWT_SECRET: ci-nightly-jwt-secret-not-for-production-use-only-testing-1234567890
      JWT_REFRESH_SECRET: ci-nightly-refresh-secret-not-for-production-use-only-testing-0987654321
      CSRF_SECRET: ci-nightly-csrf-secret-not-for-production-use-only-testing-abcdefghijklmno
      ENCRYPTION_KEY: test-encryption-key-32-characters!!
      ABUSE_HASH_PEPPER: ci-nightly-abuse-hash-pepper-not-for-production-use!!
      STRIPE_SECRET_KEY: sk_test_dummy
      STRIPE_WEBHOOK_SECRET: whsec_dummy
      CORS_ORIGIN: http://localhost:5173
      BASE_URL: http://localhost:5173
      BACKEND_URL: http://localhost:3005/api/v1
      # Frontend must talk to the CI backend (PORT=3005), not the local default :3000
      VITE_API_URL: http://localhost:3005/api/v1
      VITE_API_PROXY_TARGET: http://localhost:3005
      CI: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: "Shared: Install and Build"
        run: |
          cd circlesfera-shared
          npm ci
          npm run build

      - name: "Backend: Install, Migrate and Build"
        run: |
          cd circlesfera-backend
          npm ci
          npx prisma generate
          npx prisma migrate deploy
          npm run build

      - name: "Frontend: Install Dependencies"
        run: |
          cd circlesfera-frontend
          # vite lives in devDependencies — never omit them under NODE_ENV=test
          npm ci --include=dev

      - name: Start backend in background
        run: |
          cd circlesfera-backend
          nohup node dist/main.js > /tmp/backend.log 2>&1 &
          for i in $(seq 1 45); do
            if curl -sf "http://localhost:3005/api/v1/health" >/dev/null; then
              echo "Backend is up."
              exit 0
            fi
            sleep 2
          done
          echo "Backend failed to start in time."
          cat /tmp/backend.log
          exit 1

      - name: Start frontend in background
        run: |
          cd circlesfera-frontend
          nohup npm run dev > /tmp/frontend.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sS -o /dev/null "http://localhost:5173"; then
              echo "Frontend is up."
              exit 0
            fi
            sleep 2
          done
          echo "Frontend failed to start in time."
          cat /tmp/frontend.log
          exit 1

      # Already in the image when the versions match. After a Playwright
      # update this downloads the new browser until the image tag is updated.
      - name: Check the browser of the image matches Playwright
        run: npx playwright install chromium

      - name: Run Playwright E2E
        env:
          PLAYWRIGHT_SKIP_WEBSERVER: 'true'
        run: |
          npm run test:e2e -- --project=chromium

      - name: Dump backend logs on failure
        if: failure()
        run: |
          echo "=== backend ==="
          cat /tmp/backend.log || true
          echo "=== frontend ==="
          cat /tmp/frontend.log || true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-nightly
          path: playwright-report/
          retention-days: 7
