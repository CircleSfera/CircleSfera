name: Pull Request CI

on:
  pull_request:
    branches: [ main ]

concurrency:
  group: pr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NODE_OPTIONS: "--no-deprecation"

permissions:
  contents: read

jobs:
  test:
    name: Run Lint and Unit Tests
    # Local path: a PR that changes ci-quality.yml is checked with its own
    # version. (Some editors cannot resolve this path because the workspace
    # path contains spaces; GitHub resolves it fine.)
    uses: ./.github/workflows/ci-quality.yml
    secrets: inherit

  # The full browser suite runs on every PR and is a required check, so a
  # broken user journey cannot be merged. The nightly run stays as a daily
  # check of main.
  playwright-e2e:
    name: Playwright E2E
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The job runs inside the Playwright image, which already has the browser
    # and its system packages, so nothing is downloaded for them. The tag must
    # match the @playwright/test version in package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --user 1001 --ipc=host
    services:
      postgres:
        # Service images come from public mirrors of Docker Hub, at the same
        # pinned digests: Docker Hub limits anonymous downloads per address and
        # the runners share theirs.
        image: mirror.gcr.io/pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
        env:
          POSTGRES_USER: prisma
          POSTGRES_PASSWORD: prisma
          POSTGRES_DB: circlesfera_e2e
        options: >-
          --health-cmd "pg_isready -U prisma -d circlesfera_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: public.ecr.aws/docker/library/redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Inside the job container the services answer by their name.
      DATABASE_URL: postgresql://prisma:prisma@postgres:5432/circlesfera_e2e
      REDIS_HOST: redis
      REDIS_PORT: 6379
      NODE_ENV: test
      PORT: 3005
      JWT_SECRET: ci-smoke-jwt-secret-not-for-production-use-only-testing-1234567890
      JWT_REFRESH_SECRET: ci-smoke-refresh-secret-not-for-production-use-only-testing-0987654321
      CSRF_SECRET: ci-smoke-csrf-secret-not-for-production-use-only-testing-abcdefghijklmno
      ENCRYPTION_KEY: test-encryption-key-32-characters!!
      ABUSE_HASH_PEPPER: ci-smoke-abuse-hash-pepper-not-for-production-use!!
      STRIPE_SECRET_KEY: sk_test_dummy
      STRIPE_WEBHOOK_SECRET: whsec_dummy
      CORS_ORIGIN: http://localhost:5173
      # Do not set CLOUDINARY_NAME — a dummy name selects Cloudinary and
      # breaks the authenticated publish journeys.
      PLAYWRIGHT_SKIP_WEBSERVER: 'true'
      BASE_URL: http://localhost:5173
      BACKEND_URL: http://localhost:3005/api/v1
      VITE_API_URL: http://localhost:3005/api/v1
      VITE_API_PROXY_TARGET: http://localhost:3005
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: "Shared: Install and Build"
        run: |
          cd circlesfera-shared
          npm ci
          npm run build

      - name: "Backend: Install, Migrate and Build"
        run: |
          cd circlesfera-backend
          npm ci
          npx prisma generate
          npx prisma migrate deploy
          npm run build

      - name: "Frontend: Install Dependencies"
        run: |
          cd circlesfera-frontend
          npm ci --include=dev

      - name: Start backend in background
        run: |
          cd circlesfera-backend
          nohup node dist/main.js > /tmp/backend.log 2>&1 &
          for i in $(seq 1 45); do
            if curl -sf "http://localhost:3005/api/v1/health" >/dev/null; then
              echo "Backend is up."
              exit 0
            fi
            sleep 2
          done
          echo "Backend failed to start in time."
          cat /tmp/backend.log
          exit 1

      - name: Start frontend in background
        run: |
          cd circlesfera-frontend
          nohup npm run dev > /tmp/frontend.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sS -o /dev/null "http://localhost:5173"; then
              echo "Frontend is up."
              exit 0
            fi
            sleep 2
          done
          echo "Frontend failed to start in time."
          cat /tmp/frontend.log
          exit 1

      # Already in the image when the versions match. After a Playwright
      # update this downloads the new browser until the image tag is updated.
      - name: Check the browser of the image matches Playwright
        run: npx playwright install chromium

      - name: Run Playwright E2E
        env:
          PLAYWRIGHT_SKIP_WEBSERVER: 'true'
        run: npm run test:e2e -- --project=chromium

      # Opens every screen of the content editor and of the live at 390×844
      # and measures its controls, then drags a sticker and a slider in the
      # story composer and undoes them. The API is replaced inside the browser, so it only needs
      # the frontend that is already running.
      - name: Check control sizes of the editor and the live, and undo
        run: |
          cd circlesfera-frontend
          npx playwright test e2e/editor-control-sizes.spec.ts e2e/live-control-sizes.spec.ts e2e/story-undo.spec.ts e2e/editor-desktop-sidebar.spec.ts e2e/carousel.spec.ts e2e/post-detail.spec.ts e2e/profile-sizes.spec.ts e2e/explore-notifications.spec.ts e2e/messages-sizes.spec.ts e2e/messages.spec.ts e2e/frames-viewer.spec.ts e2e/settings-sizes.spec.ts e2e/entry-screens.spec.ts --project=chromium

      - name: Dump server logs on failure
        if: failure()
        run: |
          echo "=== backend ==="
          cat /tmp/backend.log || true
          echo "=== frontend ==="
          cat /tmp/frontend.log || true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Lighthouse measures the key public pages of the production build (mobile
  # profile) and fails the pull request when a page goes over its budget for
  # load time, layout shift, blocking time or JavaScript size.
  performance-budgets:
    name: Performance budgets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_API_URL: http://localhost:3005/api/v1
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: "Shared: Install and Build"
        run: |
          cd circlesfera-shared
          npm ci
          npm run build

      - name: "Frontend: Install and Build"
        run: |
          cd circlesfera-frontend
          npm ci --include=dev
          npm run build

      - name: Measure pages against the budgets
        run: npm run perf:budgets

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse-report
          path: lighthouse-report/
          retention-days: 7
