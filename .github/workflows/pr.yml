name: Pull Request CI

on:
  pull_request:
    branches: [ main ]

concurrency:
  group: pr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NODE_OPTIONS: "--no-deprecation"

permissions:
  contents: read

jobs:
  test:
    name: Run Lint and Unit Tests
    # Prefer owner/repo@ref over `./.github/workflows/...`: the Actions language
    # service fails to resolve relative reusable workflows in this workspace
    # (path with spaces → "Unable to find reusable workflow"). Pin to main so
    # the call matches the shared gate on origin; change ci-quality.yml on main.
    uses: CircleSfera/CircleSfera/.github/workflows/ci-quality.yml@main
    secrets: inherit

  playwright-smoke:
    name: Playwright Smoke (unauthenticated)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
        env:
          POSTGRES_USER: prisma
          POSTGRES_PASSWORD: prisma
          POSTGRES_DB: circlesfera_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prisma -d circlesfera_smoke"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://prisma:prisma@localhost:5432/circlesfera_smoke
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      NODE_ENV: test
      PORT: 3005
      JWT_SECRET: ci-smoke-jwt-secret-not-for-production-use-only-testing-1234567890
      JWT_REFRESH_SECRET: ci-smoke-refresh-secret-not-for-production-use-only-testing-0987654321
      CSRF_SECRET: ci-smoke-csrf-secret-not-for-production-use-only-testing-abcdefghijklmno
      ENCRYPTION_KEY: test-encryption-key-32-characters!!
      ABUSE_HASH_PEPPER: ci-smoke-abuse-hash-pepper-not-for-production-use!!
      STRIPE_SECRET_KEY: sk_test_dummy
      STRIPE_WEBHOOK_SECRET: whsec_dummy
      CORS_ORIGIN: http://localhost:5173
      # smoke.spec.ts is unauthenticated (empty storageState). Do not set
      # CLOUDINARY_NAME — a dummy name selects Cloudinary and would break
      # authenticated publish journeys if this job is expanded.
      PLAYWRIGHT_SKIP_WEBSERVER: 'true'
      BASE_URL: http://localhost:5173
      BACKEND_URL: http://localhost:3005/api/v1
      VITE_API_URL: http://localhost:3005/api/v1
      VITE_API_PROXY_TARGET: http://localhost:3005
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: "Shared: Install and Build"
        run: |
          cd circlesfera-shared
          npm ci
          npm run build

      - name: "Backend: Install, Migrate and Build"
        run: |
          cd circlesfera-backend
          npm ci
          npx prisma generate
          npx prisma migrate deploy
          npm run build

      - name: "Frontend: Install Dependencies"
        run: |
          cd circlesfera-frontend
          npm ci --include=dev

      - name: Start backend in background
        run: |
          cd circlesfera-backend
          nohup node dist/main.js > /tmp/backend.log 2>&1 &
          for i in $(seq 1 45); do
            if curl -sf "http://localhost:3005/api/v1/health" >/dev/null; then
              echo "Backend is up."
              exit 0
            fi
            sleep 2
          done
          echo "Backend failed to start in time."
          cat /tmp/backend.log
          exit 1

      - name: Start frontend in background
        run: |
          cd circlesfera-frontend
          nohup npm run dev > /tmp/frontend.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sS -o /dev/null "http://localhost:5173"; then
              echo "Frontend is up."
              exit 0
            fi
            sleep 2
          done
          echo "Frontend failed to start in time."
          cat /tmp/frontend.log
          exit 1

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright smoke tests
        env:
          PLAYWRIGHT_SKIP_WEBSERVER: 'true'
        run: npm run test:e2e -- e2e/smoke.spec.ts

      - name: Dump server logs on failure
        if: failure()
        run: |
          echo "=== backend ==="
          cat /tmp/backend.log || true
          echo "=== frontend ==="
          cat /tmp/frontend.log || true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
