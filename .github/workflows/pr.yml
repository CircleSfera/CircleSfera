name: Pull Request CI
# A run for the merge queue has no pull request to take its title from: it is
# named after the commit the queue is about to merge, which carries the title
# of the pull request.
run-name: ${{ github.event.pull_request.title || github.event.merge_group.head_commit.message || 'Pull Request CI' }}

on:
  pull_request:
    branches: [ main ]
  # The merge queue checks pull requests together, on top of main and of the
  # ones queued before them, before any of them reaches main.
  merge_group:

concurrency:
  group: pr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  # The pinned images the jobs start from are kept in this repository's
  # own registry.
  packages: read

jobs:
  test:
    name: Run Lint and Unit Tests
    # Local path: a PR that changes ci-quality.yml is checked with its own
    # version. (Some editors cannot resolve this path because the workspace
    # path contains spaces; GitHub resolves it fine.)
    uses: ./.github/workflows/ci-quality.yml
    secrets: inherit

  # The full browser suite runs on every PR and is a required check, so a
  # broken user journey cannot be merged. The nightly run stays as a daily
  # check of main.
  playwright-e2e:
    name: Playwright E2E
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The job runs inside the Playwright image, which already has the browser
    # and its system packages, so nothing is downloaded for them. The tag must
    # match the @playwright/test version in package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble@sha256:1507cbfc550a63a6b7396791ca4f00df17beb56342d2447b3f106c306f525579
      options: --user 1001 --ipc=host
    services:
      postgres:
        # Our own copy of the pinned image (see "Ops — copy pinned images").
        image: ghcr.io/circlesfera/circlesfera/mirror/pgvector:pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          POSTGRES_USER: prisma
          POSTGRES_PASSWORD: prisma
          POSTGRES_DB: circlesfera_e2e
        options: >-
          --health-cmd "pg_isready -U prisma -d circlesfera_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        # Our own copy of the pinned image (see "Ops — copy pinned images"):
        # the public mirror stops serving it once its daily allowance is used.
        image: ghcr.io/circlesfera/circlesfera/mirror/redis:7-alpine@sha256:57e4255cc971b1c8d6f8a6ca283ac01bc3ecdd914273ef6bfaede87aaecd6541
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Inside the job container the services answer by their name.
      DATABASE_URL: postgresql://prisma:prisma@postgres:5432/circlesfera_e2e
      REDIS_HOST: redis
      REDIS_PORT: 6379
      NODE_ENV: test
      PORT: 3005
      JWT_SECRET: ci-smoke-jwt-secret-not-for-production-use-only-testing-1234567890
      JWT_REFRESH_SECRET: ci-smoke-refresh-secret-not-for-production-use-only-testing-0987654321
      CSRF_SECRET: ci-smoke-csrf-secret-not-for-production-use-only-testing-abcdefghijklmno
      ENCRYPTION_KEY: test-encryption-key-32-characters!!
      ABUSE_HASH_PEPPER: ci-smoke-abuse-hash-pepper-not-for-production-use!!
      STRIPE_SECRET_KEY: sk_test_dummy
      STRIPE_WEBHOOK_SECRET: whsec_dummy
      CORS_ORIGIN: http://localhost:5173
      # Do not set CLOUDINARY_NAME — a dummy name selects Cloudinary and
      # breaks the authenticated publish journeys.
      PLAYWRIGHT_SKIP_WEBSERVER: 'true'
      BASE_URL: http://localhost:5173
      BACKEND_URL: http://localhost:3005/api/v1
      VITE_API_URL: http://localhost:3005/api/v1
      VITE_API_PROXY_TARGET: http://localhost:3005
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: "Shared: Install and Build"
        run: |
          cd circlesfera-shared
          npm ci
          npm run build

      - name: "Backend: Install, Migrate and Build"
        run: |
          cd circlesfera-backend
          npm ci
          npx prisma generate
          npx prisma migrate deploy
          npm run build

      - name: "Frontend: Install Dependencies"
        run: |
          cd circlesfera-frontend
          npm ci --include=dev

      - name: Start backend in background
        run: |
          cd circlesfera-backend
          nohup node dist/main.js > /tmp/backend.log 2>&1 &
          for i in $(seq 1 45); do
            if curl -sf "http://localhost:3005/api/v1/health" >/dev/null; then
              echo "Backend is up."
              exit 0
            fi
            sleep 2
          done
          echo "Backend failed to start in time."
          cat /tmp/backend.log
          exit 1

      - name: Start frontend in background
        run: |
          cd circlesfera-frontend
          nohup npm run dev > /tmp/frontend.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sS -o /dev/null "http://localhost:5173"; then
              echo "Frontend is up."
              exit 0
            fi
            sleep 2
          done
          echo "Frontend failed to start in time."
          cat /tmp/frontend.log
          exit 1

      # Already in the image when the versions match. After a Playwright
      # update this downloads the new browser until the image tag is updated.
      - name: Check the browser of the image matches Playwright
        run: npx playwright install chromium

      - name: Run Playwright E2E
        env:
          PLAYWRIGHT_SKIP_WEBSERVER: 'true'
        run: npm run test:e2e -- --project=chromium

      # Every check under circlesfera-frontend/e2e, the whole folder, so a new
      # check runs from the day it is added and a removed one leaves no name
      # behind. The checks open the screens of the app at 390×844 (and 1280×800
      # where the layout changes) with the API replaced inside the browser, so
      # they only need the frontend that is already running. They include the
      # composer captures in e2e/composer-visual.spec.ts-snapshots, whose
      # *-linux.png files are taken in this same Playwright image.
      # e2e/marketing-captures.spec.ts skips itself unless MARKETING_CAPTURES
      # is set.
      - name: Check the screens of the app
        run: |
          cd circlesfera-frontend
          npx playwright test --project=chromium

      - name: Dump server logs on failure
        if: failure()
        run: |
          echo "=== backend ==="
          cat /tmp/backend.log || true
          echo "=== frontend ==="
          cat /tmp/frontend.log || true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          # The second report holds the expected, received and difference
          # images of a capture that no longer matches.
          path: |
            playwright-report/
            circlesfera-frontend/playwright-report/
            circlesfera-frontend/test-results/
          retention-days: 7

  # Lighthouse measures the key public pages of the production build (mobile
  # profile) and fails the pull request when a page goes over its budget for
  # load time, layout shift, blocking time or JavaScript size.
  performance-budgets:
    name: Performance budgets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_API_URL: http://localhost:3005/api/v1
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: "Shared: Install and Build"
        run: |
          cd circlesfera-shared
          npm ci
          npm run build

      - name: "Frontend: Install and Build"
        run: |
          cd circlesfera-frontend
          npm ci --include=dev
          npm run build

      - name: Measure pages against the budgets
        run: npm run perf:budgets

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-report
          path: lighthouse-report/
          retention-days: 7
