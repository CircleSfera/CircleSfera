name: Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Only CodeQL uploads results; the audit job installs third-party packages
    # and keeps the read-only default.
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: javascript-typescript
          config-file: .github/codeql/codeql-config.yml

      - name: Autobuild
        uses: github/codeql-action/autobuild@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0

  npm-audit:
    name: npm audit (informative)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Informative only — do not fail the workflow on known transitive CVEs.
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install root dependencies
        run: npm install --ignore-scripts

      - name: Audit all workspace dependencies
        run: node scripts/audit-dependencies.mjs --all

      - name: Summary
        if: always()
        run: |
          {
            echo "## Dependency Vulnerability Audit"
            echo "Multi-workspace audit executed for root, backend, frontend, and shared."
            echo "Security exceptions validated against .dependency-security-exceptions.json."
          } >> "$GITHUB_STEP_SUMMARY"
