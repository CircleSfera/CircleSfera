name: Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NODE_OPTIONS: '--no-deprecation'

permissions:
  contents: read
  security-events: write

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4

  npm-audit:
    name: npm audit (informative)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Informative only — do not fail the workflow on known transitive CVEs.
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install root dependencies
        run: npm install --ignore-scripts

      - name: Audit all workspace dependencies
        run: node scripts/audit-dependencies.mjs --all

      - name: Summary
        if: always()
        run: |
          {
            echo "## Dependency Vulnerability Audit"
            echo "Multi-workspace audit executed for root, backend, frontend, and shared."
            echo "Security exceptions validated against .dependency-security-exceptions.json."
          } >> "$GITHUB_STEP_SUMMARY"
