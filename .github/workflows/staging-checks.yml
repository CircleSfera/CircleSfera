name: Staging checks in a browser

# The browser checks of staging (e2e-staging/), run without a deploy: by
# hand, and on a pull request that changes them, so a check is proven
# against staging before it joins the ones run after every staging deploy
# (deploy-environment.yml, browser-checks). Staging only: the suite refuses
# any other address, and nothing here reaches production.
on:
  workflow_dispatch:
    inputs:
      grep:
        description: Run only the checks whose name matches (empty runs all)
        required: false
        type: string
  pull_request:
    branches: [main]
    paths:
      - 'e2e-staging/**'
      - '.github/workflows/staging-checks.yml'

permissions:
  contents: read

# The checks share the environment's Test Accounts with the checks run after
# each staging deploy: one run at a time.
concurrency:
  group: staging-browser-checks
  cancel-in-progress: false

jobs:
  staging-checks:
    name: Check staging in a browser
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The Playwright image already has the browser and its system packages.
    # The tag must match the @playwright/test version in package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble@sha256:1507cbfc550a63a6b7396791ca4f00df17beb56342d2447b3f106c306f525579
      options: --user 1001 --ipc=host
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: 'npm'

      - name: Install the test runner
        run: npm ci

      - name: Run the staging checks
        env:
          STAGING_SITE_PASSWORD: ${{ secrets.STAGING_SITE_PASSWORD }}
          STAGING_TEST_ACCOUNT_PASSWORD: ${{ secrets.ENVIRONMENT_TEST_ACCOUNT_PASSWORD }}
          # The environment's own test-mode key of the payment provider.
          STAGING_STRIPE_SECRET_KEY: ${{ secrets.STAGING_STRIPE_SECRET_KEY }}
          GREP: ${{ inputs.grep }}
        run: |
          if [ -z "$STAGING_SITE_PASSWORD" ] || [ -z "$STAGING_TEST_ACCOUNT_PASSWORD" ] || [ -z "$STAGING_STRIPE_SECRET_KEY" ]; then
            echo "STAGING_SITE_PASSWORD, ENVIRONMENT_TEST_ACCOUNT_PASSWORD or STAGING_STRIPE_SECRET_KEY is not set."
            exit 1
          fi
          if [ -n "${GREP:-}" ]; then
            npx playwright test -c e2e-staging/playwright.config.ts --grep "$GREP"
          else
            npx playwright test -c e2e-staging/playwright.config.ts
          fi

      - name: Keep the report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: staging-checks-report
          path: |
            e2e-staging/report
            e2e-staging/results
          retention-days: 7
