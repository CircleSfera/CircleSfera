# One environment that is not production: staging or development. Each runs
# as its own Compose project (-p circlesfera-<name>) from its own checkout, so
# its containers, network, database, cache and files are its own. Nothing here
# is shared with production except the server and the registry.
#
#   ENV_NAME    staging | dev
#   PROXY_PORT  the loopback port the host nginx sends this environment to
#   IMAGE_TAG   the images built for this environment (<name>-<commit>)
#
# Every container has a memory and processor limit: an environment that
# misbehaves cannot take the server from production.
x-logging: &default-logging
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"

services:

  nginx-proxy:
    <<: *default-logging
    image: nginx:alpine@sha256:c8497b180665e631ec92a5091125bec5b214f0e2b99409e30653a125b37557da
    container_name: CircleSfera-${ENV_NAME:?Set ENV_NAME}-Proxy
    ports:
      # Loopback only: the host nginx is the single way in, and it asks for
      # the environment's password.
      - "127.0.0.1:${PROXY_PORT:?Set PROXY_PORT}:80"
    environment:
      - FRONTEND_PORT=80
      - BACKEND_PORT=3000
    volumes:
      # The same proxy rules as production. No site of the template names
      # this environment's addresses, so its default site answers them.
      - ./nginx/master.conf.template:/etc/nginx/templates/default.conf.template:ro
      - uploads_data:/usr/share/nginx/html/uploads:ro
    depends_on:
      backend:
        condition: service_started
      frontend:
        condition: service_started
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.5
    networks:
      - environment

  postgres:
    <<: *default-logging
    image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
    container_name: CircleSfera-${ENV_NAME}-Postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 1g
    cpus: 1.0
    networks:
      - environment

  redis:
    <<: *default-logging
    image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    container_name: CircleSfera-${ENV_NAME}-Redis
    # The deploy refuses settings without REDIS_PASSWORD before it gets here.
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?}"]
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    mem_limit: 256m
    cpus: 0.5
    networks:
      - environment

  backend:
    <<: *default-logging
    image: ${REGISTRY:-ghcr.io/circlesfera/circlesfera}/env/backend:${IMAGE_TAG:?Set IMAGE_TAG}
    container_name: CircleSfera-${ENV_NAME}-Backend
    env_file:
      - path: ./.env
        required: true
    environment:
      - NODE_ENV=production
      - DB_HOST=postgres
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
    volumes:
      - uploads_data:/app/circlesfera-backend/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "./scripts/prisma-migrate-deploy.sh && node dist/main"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/api/v1/health',(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 90s
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.5
    networks:
      - environment

  frontend:
    <<: *default-logging
    image: ${REGISTRY:-ghcr.io/circlesfera/circlesfera}/env/frontend:${IMAGE_TAG}
    container_name: CircleSfera-${ENV_NAME}-Frontend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.5
    networks:
      - environment

volumes:
  postgres_data:
  redis_data:
  uploads_data:

networks:
  environment:
    driver: bridge
