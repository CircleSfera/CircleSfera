# One environment that is not production: staging or development. Each runs
# as its own Compose project (-p circlesfera-<name>) from its own checkout, so
# its containers, network, database, cache and files are its own. Nothing here
# is shared with production except the server and the registry.
#
#   ENV_NAME    staging | dev
#   PROXY_PORT  the loopback port the host nginx sends this environment to
#   IMAGE_TAG   the images built for this environment (<name>-<commit>)
#
# The live service (profile "live") runs only where the settings carry its
# key; the deploy switches the profile on and gives it its ports:
#
#   LIVE_HTTP_PORT  loopback port the host nginx sends the signalling to
#   LIVE_TCP_PORT   media over TCP, open to the internet
#   LIVE_UDP_PORT   media over UDP, open to the internet
#
# Every container has a memory and processor limit: an environment that
# misbehaves cannot take the server from production.
x-logging: &default-logging
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"

services:

  nginx-proxy:
    <<: *default-logging
    image: nginx:alpine@sha256:a3554c0d0b48177b1413c26e01f695334428020d9df01243fbae3e11cfd17417
    container_name: CircleSfera-${ENV_NAME:?Set ENV_NAME}-Proxy
    ports:
      # Loopback only: the host nginx is the single way in, and it asks for
      # the environment's password.
      - "127.0.0.1:${PROXY_PORT:?Set PROXY_PORT}:80"
    environment:
      - FRONTEND_PORT=80
      - BACKEND_PORT=3000
    volumes:
      # The same proxy rules as production. No site of the template names
      # this environment's addresses, so its default site answers them.
      - ./nginx/master.conf.template:/etc/nginx/templates/default.conf.template:ro
      - uploads_data:/usr/share/nginx/html/uploads:ro
    depends_on:
      backend:
        condition: service_started
      frontend:
        condition: service_started
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.5
    networks:
      - environment

  postgres:
    <<: *default-logging
    image: pgvector/pgvector:pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
    container_name: CircleSfera-${ENV_NAME}-Postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 1g
    cpus: 1.0
    networks:
      - environment

  redis:
    <<: *default-logging
    image: redis:7-alpine@sha256:6ba19c50b56777f5c11c58eff8ddb69d0d5f27ba131cffb63f180ccfd43c66af
    container_name: CircleSfera-${ENV_NAME}-Redis
    # The deploy refuses settings without REDIS_PASSWORD before it gets here.
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?}"]
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    mem_limit: 256m
    cpus: 0.5
    networks:
      - environment

  backend:
    <<: *default-logging
    image: ${REGISTRY:-ghcr.io/circlesfera/circlesfera}/env/backend:${IMAGE_TAG:?Set IMAGE_TAG}
    container_name: CircleSfera-${ENV_NAME}-Backend
    env_file:
      - path: ./.env
        required: true
    environment:
      - NODE_ENV=production
      - DB_HOST=postgres
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
    volumes:
      - uploads_data:/app/circlesfera-backend/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "./scripts/prisma-migrate-deploy.sh && node dist/main"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/api/v1/health',(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 90s
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.5
    networks:
      - environment

  frontend:
    <<: *default-logging
    image: ${REGISTRY:-ghcr.io/circlesfera/circlesfera}/env/frontend:${IMAGE_TAG}
    container_name: CircleSfera-${ENV_NAME}-Frontend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.5
    networks:
      - environment

  # The live service of the environment: the broadcasts' video goes through
  # this server and no hosted service. It answers on the environment's own
  # address (the host nginx sends /rtc and /twirp here); the media travels on
  # the two ports below, which the server's firewall must let in.
  livekit:
    <<: *default-logging
    profiles: ["live"]
    image: livekit/livekit-server:v1.13.10@sha256:89ca9ce0791e18d6e03bf6e2c49ceb27e1c754eae8bd50c989386c1a5963791a
    container_name: CircleSfera-${ENV_NAME}-LiveKit
    ports:
      - "127.0.0.1:${LIVE_HTTP_PORT:-7880}:7880"
      # Same number inside and outside: the service tells each browser the
      # port to send media to, and that is the port it listens on.
      - "${LIVE_TCP_PORT:-7881}:${LIVE_TCP_PORT:-7881}/tcp"
      - "${LIVE_UDP_PORT:-7882}:${LIVE_UDP_PORT:-7882}/udp"
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        rtc:
          tcp_port: ${LIVE_TCP_PORT:-7881}
          udp_port: ${LIVE_UDP_PORT:-7882}
          use_external_ip: ${LIVE_USE_EXTERNAL_IP:-true}
        redis:
          address: redis:6379
          password: ${REDIS_PASSWORD}
        keys:
          ${LIVEKIT_API_KEY:-unset}: ${LIVEKIT_API_SECRET:-unset}
        logging:
          level: info
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.5
    networks:
      - environment

  # The recorder: it joins a broadcast like one more viewer and writes it to
  # a file. No more than LIVE_RECORDINGS_AT_ONCE at a time; another one waits.
  egress:
    <<: *default-logging
    profiles: ["live"]
    image: livekit/egress:v1.15.0@sha256:ac244a40268ce1dd1510fbff6eb529609ec68aceff1602343f79be8ca08c355b
    container_name: CircleSfera-${ENV_NAME}-Recorder
    environment:
      EGRESS_CONFIG_BODY: |
        api_key: ${LIVEKIT_API_KEY:-unset}
        api_secret: ${LIVEKIT_API_SECRET:-unset}
        ws_url: ws://livekit:7880
        redis:
          address: redis:6379
          password: ${REDIS_PASSWORD}
        logging:
          level: info
    volumes:
      - recordings_data:/out
    depends_on:
      livekit:
        condition: service_started
    restart: unless-stopped
    mem_limit: 2g
    cpus: 2.0
    networks:
      - environment

volumes:
  postgres_data:
  redis_data:
  uploads_data:
  recordings_data:

networks:
  environment:
    driver: bridge
