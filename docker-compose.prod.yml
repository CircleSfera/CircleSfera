# Global logging configuration to prevent disk exhaustion
x-logging: &default-logging
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"

services:

  nginx-proxy:
    <<: *default-logging
    image: nginx:alpine@sha256:785835ea65db4bba6f021acc0f3be91b0fef76a53fe41f8588c6698d2aed0606
    container_name: CircleSfera-Proxy
    ports:
      # Loopback only: the host nginx is the single way in. Published on all
      # interfaces, the port let clients skip TLS and forge X-Forwarded-For.
      # Docker publishes ports past ufw, so the firewall would not close it.
      - "127.0.0.1:8082:80"
    environment:
      - FRONTEND_PORT=80
      - BACKEND_PORT=3000
    volumes:
      # TLS terminates on the VPS host nginx (certs generated/renewed on the host).
      # This container only serves HTTP on the published port (127.0.0.1:8082→80).
      - ./nginx/master.conf.template:/etc/nginx/templates/default.conf.template:ro
      - uploads_data:/usr/share/nginx/html/uploads:ro
    depends_on:
      backend:
        condition: service_started
      frontend:
        condition: service_started
    restart: unless-stopped
    networks:
      - circlesfera-network

  postgres:
    <<: *default-logging
    image: pgvector/pgvector:pg16@sha256:0dd3149a06e4579a0d70d8fef9945636cd514005e7237deb27f9b67886f8dc4f
    container_name: CircleSfera-Postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - circlesfera-network

  redis:
    <<: *default-logging
    image: redis:7-alpine@sha256:8da19c7399dca900c6822a1cf30f9d2285585e2c4b457ff4095b0f4500054d3f
    container_name: CircleSfera-Redis
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env.production}"]
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    networks:
      - circlesfera-network

  backend:
    <<: *default-logging
    image: ${REGISTRY:-ghcr.io/circlesfera/circlesfera}/backend:latest
    container_name: CircleSfera-Backend
    env_file:
      - path: ./.env.production
        required: false
    environment:
      - NODE_ENV=production
      - DB_HOST=postgres
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # Prefer value from env_file; only interpolate when set (avoid blank override)
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      # DATABASE_URL mapped via postgres credentials
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
    volumes:
      - uploads_data:/app/circlesfera-backend/uploads
      # Analytics ETL CSV (BullMQ nightly job). Host path: ETL_HOST_DIR in .env.production.
      - ${ETL_HOST_DIR:-./backups/etl}:/app/circlesfera-backend/backups/etl
      # Recordings of broadcasts, once production runs its own live service
      # and recorder (the two services at the end of this file, commented):
      # - recordings_data:/app/circlesfera-backend/recordings
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "./scripts/prisma-migrate-deploy.sh && node dist/main"
    # node:alpine images do not include wget/curl by default
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/api/v1/health',(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 90s
    restart: unless-stopped
    networks:
      - circlesfera-network

  frontend:
    <<: *default-logging
    image: ${REGISTRY:-ghcr.io/circlesfera/circlesfera}/frontend:latest
    container_name: CircleSfera-Frontend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - circlesfera-network

  # Production's own live service and recorder, as staging and dev run them
  # (docker-compose.env.yml). Off until the owner switches production away
  # from the hosted live service: uncomment the three (livekit,
  # recordings-folder and egress), the backend's recordings
  # line above and the recordings_data volume below, set the settings named
  # in infra/host/environment.env.example, and open the media ports in the
  # firewall (7881/tcp and 7882/udp). Images as in docker-compose.env.yml.
  #
  # livekit:
  #   <<: *default-logging
  #   image: livekit/livekit-server:v1.13.10@sha256:89ca9ce0791e18d6e03bf6e2c49ceb27e1c754eae8bd50c989386c1a5963791a
  #   container_name: CircleSfera-LiveKit
  #   ports:
  #     - "127.0.0.1:7880:7880"
  #     - "7881:7881/tcp"
  #     - "7882:7882/udp"
  #   environment:
  #     LIVEKIT_CONFIG: |
  #       port: 7880
  #       rtc:
  #         tcp_port: 7881
  #         udp_port: 7882
  #         use_external_ip: true
  #       redis:
  #         address: redis:6379
  #         password: ${REDIS_PASSWORD}
  #       keys:
  #         ${LIVEKIT_API_KEY:?}: ${LIVEKIT_API_SECRET:?}
  #   depends_on:
  #     redis:
  #       condition: service_healthy
  #   restart: unless-stopped
  #   mem_limit: 1g
  #   cpus: 2.0
  #   networks:
  #     - circlesfera-network
  #
  # # The recorder's folder, readied as in docker-compose.env.yml: a new
  # # volume is writable by root alone, and the recorder is not root.
  # recordings-folder:
  #   <<: *default-logging
  #   image: ${REGISTRY:-ghcr.io/circlesfera/circlesfera}/backend:${IMAGE_TAG:-latest}
  #   user: "0:0"
  #   entrypoint: ["sh", "-c", "chown node:root /out && chmod 2775 /out"]
  #   volumes:
  #     - recordings_data:/out
  #   restart: "no"
  #   networks:
  #     - circlesfera-network
  #
  # egress:
  #   <<: *default-logging
  #   image: livekit/egress:v1.15.0@sha256:ac244a40268ce1dd1510fbff6eb529609ec68aceff1602343f79be8ca08c355b
  #   container_name: CircleSfera-Recorder
  #   environment:
  #     EGRESS_CONFIG_BODY: |
  #       api_key: ${LIVEKIT_API_KEY:?}
  #       api_secret: ${LIVEKIT_API_SECRET:?}
  #       ws_url: ws://livekit:7880
  #       redis:
  #         address: redis:6379
  #         password: ${REDIS_PASSWORD}
  #   volumes:
  #     - recordings_data:/out
  #   depends_on:
  #     recordings-folder:
  #       condition: service_completed_successfully
  #     livekit:
  #       condition: service_started
  #   restart: unless-stopped
  #   mem_limit: 4g
  #   cpus: 4.0
  #   networks:
  #     - circlesfera-network

volumes:
  postgres_data:
  redis_data:
  uploads_data:
  # recordings_data:

networks:
  circlesfera-network:
    driver: bridge
