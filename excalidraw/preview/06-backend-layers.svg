<text x="868.0" y="164.2" font-size="13.0" font-family="Helvetica, Arial, sans-serif" fill="#3949AB" text-anchor="start" opacity="1.00">Globals (app.module.ts)</text>
<text x="868.0" y="180.4" font-size="13.0" font-family="Helvetica, Arial, sans-serif" fill="#3949AB" text-anchor="start" opacity="1.00">APP_PIPE ValidationPipe</text>
<text x="868.0" y="196.7" font-size="13.0" font-family="Helvetica, Arial, sans-serif" fill="#3949AB" text-anchor="start" opacity="1.00">APP_GUARD ThrottlerGuard</text>
<text x="868.0" y="212.9" font-size="13.0" font-family="Helvetica, Arial, sans-serif" fill="#3949AB" text-anchor="start" opacity="1.00">APP_FILTER AllExceptionsFilter</text>
<text x="868.0" y="229.2" font-size="13.0" font-family="Helvetica, Arial, sans-serif" fill="#3949AB" text-anchor="start" opacity="1.00">Logger nestjs-pino (redact cookies + authorization)</text>
<text x="868.0" y="245.4" font-size="13.0" font-family="Helvetica, Arial, sans-serif" fill="#3949AB" text-anchor="start" opacity="1.00">ScheduleModule · EventEmitterModule (in-process only)</text>
<text x="868.0" y="261.7" font-size="13.0" font-family="Helvetica, Arial, sans-serif" fill="#3949AB" text-anchor="start" opacity="1.00">RedisCacheModule · BullModule</text>
<rect x="860.0" y="350.0" width="480.0" height="240.0" rx="10" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="2"  opacity="1.00" />
<text x="868.0" y="407.9" font-size="13.0" font-family="Helvetica, Arial, sans-serif" fill="#7B1FA2" text-anchor="start" opacity="1.00">Hard rules</text>
<text x="868.0" y="424.2" font-size="13.0" font-family="Helvetica, Arial, sans-serif" fill="#7B1FA2" text-anchor="start" opacity="1.00">• No repository layer. No mapper layer. Do not introduce.</text>
<text x="868.0" y="440.4" font-size="13.0" font-family="Helvetica, Arial, sans-serif" fill="#7B1FA2" text-anchor="start" opacity="1.00">• Ownership usually in services; OwnershipGuard exists</text>
<text x="868.0" y="456.7" font-size="13.0" font-family="Helvetica, Arial, sans-serif" fill="#7B1FA2" text-anchor="start" opacity="1.00">  and is used on some post mutations.</text>
<text x="868.0" y="472.9" font-size="13.0" font-family="Helvetica, Arial, sans-serif" fill="#7B1FA2" text-anchor="start" opacity="1.00">• EventEmitter2 is in-process</text>
<text x="868.0" y="489.2" font-size="13.0" font-family="Helvetica, Arial, sans-serif" fill="#7B1FA2" text-anchor="start" opacity="1.00">  (notification.create, media.delete_batch,</text>
<text x="868.0" y="505.4" font-size="13.0" font-family="Helvetica, Arial, sans-serif" fill="#7B1FA2" text-anchor="start" opacity="1.00">  payment.live_gift_completed)</text>
<text x="868.0" y="521.7" font-size="13.0" font-family="Helvetica, Arial, sans-serif" fill="#7B1FA2" text-anchor="start" opacity="1.00">  — NOT a domain event bus / not EventEmitter</text>
<text x="868.0" y="537.9" font-size="13.0" font-family="Helvetica, Arial, sans-serif" fill="#7B1FA2" text-anchor="start" opacity="1.00">  as architecture between modules.</text>
