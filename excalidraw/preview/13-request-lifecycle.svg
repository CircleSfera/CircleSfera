<text x="116.0" y="443.3" font-size="18.0" font-family="Helvetica, Arial, sans-serif" fill="#F9A825" text-anchor="start" opacity="1.00">NestJS API</text>
<text x="116.0" y="471.2" font-size="15.0" font-family="Helvetica, Arial, sans-serif" fill="#212121" text-anchor="start" opacity="1.00">4.  cookieParser, CSRF (unless excluded), body parser (50mb)</text>
<text x="116.0" y="490.0" font-size="15.0" font-family="Helvetica, Arial, sans-serif" fill="#212121" text-anchor="start" opacity="1.00">5.  ValidationPipe</text>
<text x="116.0" y="508.8" font-size="15.0" font-family="Helvetica, Arial, sans-serif" fill="#212121" text-anchor="start" opacity="1.00">6.  ThrottlerGuard</text>
<text x="116.0" y="527.5" font-size="15.0" font-family="Helvetica, Arial, sans-serif" fill="#212121" text-anchor="start" opacity="1.00">7.  Route guard (JwtAuthGuard etc.)</text>
<text x="116.0" y="546.2" font-size="15.0" font-family="Helvetica, Arial, sans-serif" fill="#212121" text-anchor="start" opacity="1.00">8.  Controller binds DTO → Service</text>
<text x="116.0" y="565.0" font-size="15.0" font-family="Helvetica, Arial, sans-serif" fill="#212121" text-anchor="start" opacity="1.00">9.  Service: authorize (ownership / plan / identity) → Prisma and/or cache</text>
<text x="116.0" y="583.8" font-size="15.0" font-family="Helvetica, Arial, sans-serif" fill="#212121" text-anchor="start" opacity="1.00">10. Optional: enqueue BullMQ, emit in-process event,</text>
<text x="116.0" y="602.5" font-size="15.0" font-family="Helvetica, Arial, sans-serif" fill="#212121" text-anchor="start" opacity="1.00">    socket to room user:{id}</text>
<text x="116.0" y="621.2" font-size="15.0" font-family="Helvetica, Arial, sans-serif" fill="#212121" text-anchor="start" opacity="1.00">11. AllExceptionsFilter shapes errors; 5xx → Sentry/Slack</text>
<text x="116.0" y="640.0" font-size="15.0" font-family="Helvetica, Arial, sans-serif" fill="#212121" text-anchor="start" opacity="1.00">12. JSON response</text>
