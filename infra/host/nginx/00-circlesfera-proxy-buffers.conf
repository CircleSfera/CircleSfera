# Response header buffer of the host nginx, the one that terminates TLS in
# front of the container proxy. The stock value is one memory page (4k): an
# answer whose headers pass it is turned into a 502 ("upstream sent too big
# header"). A sign-in answer carries the security headers and two session
# cookies and sits close to 4k. These match the container proxy
# (nginx/master.conf.template).
#
# Loaded in the http block, so it is the default for every site on this host;
# a site that sets its own values keeps them.
proxy_buffer_size 16k;
proxy_buffers 8 16k;
proxy_busy_buffers_size 32k;
