# The dev environment of CircleSfera, on the host nginx that terminates TLS.
# Installed by infra/host/apply-environments.sh. It sends everything to the
# environment's own proxy on a loopback port; production is on another port
# and is never reached from here.
#
# The whole environment is behind a password and is kept out of search
# engines. The health route is open so that a deploy and a monitor can read it.
server {
    listen 80;
    listen [::]:80;
    server_name dev.circlesfera.com admin.dev.circlesfera.com backoffice.dev.circlesfera.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name dev.circlesfera.com admin.dev.circlesfera.com backoffice.dev.circlesfera.com;

    ssl_certificate /etc/letsencrypt/live/dev.circlesfera.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.circlesfera.com/privkey.pem;

    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    auth_basic "CircleSfera dev";
    auth_basic_user_file /etc/nginx/circlesfera-dev.htpasswd;

    client_max_body_size 100m;

    location = /robots.txt {
        auth_basic off;
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location = /api/v1/health {
        auth_basic off;
        proxy_pass http://127.0.0.1:8084;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The notices of the payment provider. No password here: the provider
    # cannot send one, and the backend accepts a notice only when its
    # signature matches one of the environment's own secrets.
    location = /api/v1/payments/webhook {
        auth_basic off;
        proxy_pass http://127.0.0.1:8084;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The environment's own live service: the signalling of a broadcast and
    # the service's API. No password asked here: every request carries a
    # signed token of the service itself, in the address for the signalling
    # (/rtc) and in its own header for the API (/twirp), which the backend
    # calls.
    location ~ ^/rtc(/|$) {
        auth_basic off;
        # The browser sends this site's password on every request, and the
        # live service would read it in place of the token in the address
        # and refuse the connection.
        proxy_set_header Authorization "";
        proxy_pass http://127.0.0.1:7884;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location ~ ^/twirp(/|$) {
        auth_basic off;
        proxy_pass http://127.0.0.1:7884;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:8084;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_request_buffering off;
    }
}
