server {
    listen 80;
    listen [::]:80;
    server_name circlesfera.com www.circlesfera.com admin.circlesfera.com backoffice.circlesfera.com;
    client_max_body_size 500M;
    proxy_read_timeout 300s;
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # HTTP/2, as staging and development have it: one connection carries the
    # app's many small requests. Sockets still open over HTTP/1.1.
    http2 on;
    server_name circlesfera.com www.circlesfera.com admin.circlesfera.com backoffice.circlesfera.com;
    client_max_body_size 500M;
    proxy_read_timeout 300s;
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
    ssl_certificate /etc/letsencrypt/live/circlesfera.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/circlesfera.com/privkey.pem;
    location / {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        # An upload goes on to the proxy behind as it arrives, instead of
        # being written whole to this server's disk first (up to 500 MB);
        # the proxy behind sets each route's own limit.
        proxy_request_buffering off;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
