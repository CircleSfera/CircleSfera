# SSH hardening for the production VPS. Installed as
# /etc/ssh/sshd_config.d/00-circlesfera-hardening.conf by infra/host/apply.sh.
#
# sshd keeps the first value it reads for each option and reads this
# directory in name order, so the 00- prefix wins over 50-cloud-init.conf,
# which turns password logins on.

# Keys only: no passwords, no keyboard-interactive prompts.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no

# Unauthenticated connections are dropped after 30 seconds.
LoginGraceTime 30
X11Forwarding no
